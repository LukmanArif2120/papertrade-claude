# Harga harian percuma (yfinance) -> BacktestShariah2/data/harga/
# Sesi Claude tidak boleh capai Yahoo; runner GitHub boleh. Tugasan Claude hanya membaca fail ini.
# Masa (UTC): 21:37 Isn–Jum = 5:37 pagi MYT; 00:23 Sel–Sab = sandaran (volum muktamad).
# Jadual GitHub kerap lewat 2–4 jam (14–15 Okt 2026), jadi rutin 6:02 menembak workflow_dispatch
# sendiri jika data belum siap (jadual/kemas_kini_0602.md langkah 0a). Jadual di bawah hanya sandaran.
name: Harga harian

on:
  schedule:
    # Didaftar semula 19 Okt 2026: tiada cetusan jadual sejak 17 Okt 14:10 UTC (semua workflow active).
    # Jika cetusan hilang/lewat > 30 minit, penjaga_jadual.yml mencetus workflow_dispatch (dalam had masa).
    - cron: '37 21 * * 1-5'
    - cron: '23 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harga-harian
  cancel-in-progress: false

jobs:
  harga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q pandas numpy yfinance exchange_calendars
      - name: Tarik 10 sesi terakhir
        run: python3 BacktestShariah2/standard/harga_yf.py terkini
      - name: Tarik sejarah (jika perlu_sejarah.txt wujud; fail dipadam selepas siap)
        if: ${{ hashFiles('BacktestShariah2/data/harga/perlu_sejarah.txt') != '' }}
        run: python3 BacktestShariah2/standard/harga_yf.py sejarah
      - name: Commit dan push
        run: |
          git config user.name "harga-harian[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BacktestShariah2/data/harga
          if git diff --cached --quiet; then echo "tiada perubahan"; exit 0; fi
          SESI=$(python3 -c "import json;print(json.load(open('BacktestShariah2/data/harga/status.json'))['terkini']['sesi'])")
          git commit -q -m "Harga harian (yfinance): sesi $SESI"
          for n in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((n * 10))
          done
          exit 1
