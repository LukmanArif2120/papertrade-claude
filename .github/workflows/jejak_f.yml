# Jejak hadapan kohort F (BacktestShariah2/kajian/carian_setup/cs_hadapan.py): papertrade maya bagi setup carian CS yang
# lulus (kajian/SPEC_CARIAN_SETUP.md pindaan 13 Nov 2026 (f)). Penjejak BERASINGAN: tidak menyentuh Lejar, Papertrade C,
# kad skor atau dashboard. Tanpa LLM, tiada order. Dikira semula sepenuhnya daripada stor harga setiap larian.
# Tiada cron: dicetus sebaik "Lejar penuh" siap (stor harga sudah dikemas malam itu), seperti analisis.yml.
# Larian Lejar yang didispatch penjaga (GITHUB_TOKEN) tidak menjana workflow_run: lejar.yml mencetus workflow ini terus
# melalui langkah akhirnya (14 Nov 2026).
name: Jejak hadapan F

on:
  workflow_run:
    workflows: ['Lejar penuh']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jejak-f
  cancel-in-progress: false

jobs:
  jejak:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt -r requirements.txt yfinance
      - name: Jejak kohort F
        run: python3 BacktestShariah2/kajian/carian_setup/cs_hadapan.py jejak
      # Papertrade 29 setup gred A (pindaan 16 Nov 2026 (ae) Bahagian D): log isyarat tambah-sahaja + kalendar laporan
      # seperti diketahui hari itu. Kegagalannya tidak menyekat komit penjejak lama; langkah akhir menggagalkan larian.
      # Alam = SEMUA saham alam backtest, bukan senarai Shariah (pindaan 17 Nov 2026 (af)): harga 3 tahun bagi 3,260 saham
      # ditarik segar dari Yahoo ke folder sementara (TIDAK dikomit) dan kalendar laporan Nasdaq ditarik bagi semua saham.
      # Liputan harga < 90 % atau kalendar tidak lengkap = langkah gagal, tiada isyarat ditulis (hari itu diisi kemudian
      # sebagai lewat).
      # DIJEDA 17 Nov 2026 (keputusan pengguna "jangan papertrade lagi"): langkah dilangkau selagi fail jejak_f2/JEDA wujud.
      - name: Papertrade gred A
        id: greda
        if: ${{ hashFiles('BacktestShariah2/jejak_f2/JEDA') == '' }}
        continue-on-error: true
        timeout-minutes: 50
        run: |
          H="$RUNNER_TEMP/harga_semua"
          python3 BacktestShariah2/kajian/carian_setup/cs_hadapan19.py harga --ke "$H"
          python3 BacktestShariah2/kajian/carian_setup/cs_hadapan19.py kalendar --stor "$H" --ke "$H/kalendar.json"
          python3 BacktestShariah2/kajian/carian_setup/cs_hadapan19.py jejak --stor "$H" --kalendar "$H/kalendar.json"
      - name: Commit dan push
        run: |
          git config user.name "jejak-f[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BacktestShariah2/jejak_f/lejar.csv BacktestShariah2/jejak_f/RINGKASAN.md BacktestShariah2/jejak_f2
          if git diff --cached --quiet; then echo "tiada perubahan"; exit 0; fi
          git commit -q -m "Jejak hadapan F: harga $(tail -n +2 BacktestShariah2/data/harga/stor/harga_idx.csv | cut -d, -f2 | sort | tail -1)"
          for n in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 15))
          done
          echo "Push gagal; larian seterusnya menjana semula." >&2
          exit 1
      - name: Gagal jika papertrade gred A gagal
        if: steps.greda.outcome == 'failure'
        run: |
          echo "Papertrade gred A gagal (harga semua saham, kalendar atau jejak; lihat langkah Papertrade gred A)." >&2
          exit 1
