# Pengawal papertrade (BacktestShariah2/standard/pengawal.py): semak bahawa pengumpulan data M DAN N
# berjalan, dan jalankan remedi yang selamat.
#
# Papertrade ialah mekanisme pengumpulan data, bukan dagangan: sesi yang terlepas ialah lubang KEKAL,
# kerana isyarat hari itu tidak boleh dijana semula pada harga hari itu kemudian. Audit 3 Nov 2026
# menemui dua kegagalan yang berjalan SENYAP berhari-hari (835 posisi Nxx tidak dikemas kini; susunan
# yang akan meranapkan lejar) dan kedua-duanya ditemui hanya kerana seseorang pergi mencari.
#
# Masa: 12:35 UTC, selepas tingkap malam (harian 05:07-11:07, lejar 06:17/10:17) dan kira-kira sejam
# SEBELUM beli.yml 13:40 - supaya apa-apa yang perlu dibetulkan sempat dibetulkan sebelum belian.
# Juga selepas setiap larian Lejar penuh, dan boleh dicetus tangan.
#
# ntfy hanya dihantar apabila ada sesuatu untuk dikatakan (masalah tinggal, atau remedi dijalankan).
# Pengawal yang menghantar "semua baik" setiap hari akan diabaikan, dan pengawal yang diabaikan
# tidak melindungi apa-apa.
name: Pengawal papertrade

on:
  schedule:
    - cron: '35 12 * * 1-5'
  workflow_run:
    workflows: ['Lejar penuh']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papertrade          # jangan sekali-kali berlumba dengan harian.yml / beli.yml / petang.yml
  cancel-in-progress: false

jobs:
  pengawal:
    runs-on: ubuntu-latest
    # 240 minit, bukan 40. Remedi TERPENTING pengawal ialah kejar.py, dan satu sesi kejar ialah
    # imbasan penuh 228 kaedah = ~45 minit pada pelaksana GitHub (diukur 3 Nov 2026). kejar.py
    # menghadkan dirinya kepada 5 sesi tertinggal, jadi kes paling teruk ~225 minit. Had 40 minit
    # yang asal bermakna pengawal akan dibunuh di tengah imbasan TEPAT pada hari ia diperlukan -
    # dan kerana langkah commit tidak akan berjalan, kerja itu hilang bersama runner.
    #
    # Pengawal memegang kunci concurrency 'papertrade' selama itu, jadi beli.yml 13:40 akan
    # menunggu. Itu BETUL dan disengajakan: jika sesi belum diproses, senarai_beli basi dan
    # beli.yml akan menolak belian ("tak beli") - jadi membetulkan data dahulu ialah pertukaran
    # yang betul. beli.yml ada cron sandaran 14:40, 16:25 dan 19:25 UTC untuk memulihkan.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt pandas numpy exchange_calendars
      - name: Semak + betulkan
        id: semak
        run: |
          set +e
          python3 BacktestShariah2/standard/pengawal.py --betulkan > /tmp/pengawal.json 2>/tmp/pengawal.err
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/pengawal.json || true
          [ -s /tmp/pengawal.err ] && { echo "--- stderr ---"; cat /tmp/pengawal.err; } || true
          M=$(python3 BacktestShariah2/standard/pengawal.py --ntfy 2>/dev/null | head -1)
          echo "mesej<<EOF" >> "$GITHUB_OUTPUT"; echo "$M" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$M"
          C=$(python3 -c "import json;print(' '.join(json.load(open('/tmp/pengawal.json')).get('cetus') or []))" 2>/dev/null || echo "")
          echo "cetus=$C" >> "$GITHUB_OUTPUT"; [ -n "$C" ] && echo "::warning::perlu dicetus: $C" || true
      - name: Commit pembetulan
        run: |
          git config user.name "pengawal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/isyarat WAJIB ada di sini: remedi kejar.py menulis rekod isyarat sesi yang
          # dikejar ke sana (14,803 baris bagi sesi 2026-11-02), dan tanpa baris ini imbasan
          # pemulihan akan mengkomit posisi tetapi MEMBUANG isyarat yang menghasilkannya -
          # pemulihan separa yang kelihatan lengkap.
          git add BacktestShariah2/papertrade BacktestShariah2/data/isyarat 2>/dev/null || true
          if git diff --cached --quiet; then echo "tiada pembetulan untuk dikomit"; exit 0; fi
          git commit -q -m "Pengawal papertrade: remedi automatik"
          for n in 1 2 3 4; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 20))
          done
          echo "Push gagal" >&2; exit 1
      # Pengawal MENCETUS saluran yang diuji; ia tidak meniru imbasannya. Apabila sesi terkini belum
      # diproses, itu bermakna harian.yml belum menjalankan tugasnya - dan jawapannya ialah
      # menjalankan harian.yml, bukan membina laluan kedua yang tidak pernah diuji dalam produksi.
      # Sama bagi lejar.yml. Setiap workflow itu idempoten dan ada concurrency sendiri, jadi cetusan
      # berganda selamat.
      - name: Cetus workflow yang belum menjalankan tugasnya
        if: steps.semak.outputs.cetus != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for W in ${{ steps.semak.outputs.cetus }}; do
            echo "cetus $W"
            gh workflow run "$W" --ref main --repo "$GITHUB_REPOSITORY" || echo "::warning::gagal cetus $W"
          done
      - name: Notifikasi ntfy (hanya jika ada sesuatu untuk dikatakan)
        if: always() && !contains(steps.semak.outputs.mesej, 'semua baik')
        env:
          TOPIK: ${{ secrets.NTFY_TOPIC || 'claude_azim' }}
          MESEJ: ${{ steps.semak.outputs.mesej }}
        run: |
          curl -sS -m 20 -H "Title: Papertrade: pengawal" -H "Tags: shield" -d "${MESEJ:-pengawal gagal berjalan}" \
            "https://ntfy.sh/$TOPIK" > /dev/null || echo "::warning::ntfy gagal"
      - name: Gagalkan larian jika ada masalah tinggal
        # Supaya amaran_ntfy.yml turut menangkapnya, dan larian merah kelihatan dalam senarai Actions.
        if: steps.semak.outputs.rc != '0'
        run: |
          echo "::error::pengawal: ada masalah yang tinggal (lihat langkah Semak)"
          exit 1
