# Semakan automatik setiap push ke main: ujian unit + sahkan.py (semak sahaja, tanpa --betulkan).
# Gagal = data atau kod rosak; GitHub menghantar e-mel kegagalan kepada pemilik repo.
# Commit bot harga harian (GITHUB_TOKEN) tidak mencetus workflow ini.
name: Semak data

on:
  push:
    branches: [main]
    paths:
      - 'BacktestShariah2/**'
      - 'requirements.txt'
      - '**/*.py'
      - 'ruff.toml'
      - '.github/workflows/**'
  # Ditambah 4 Nov 2026 selepas kegagalan yang ia akan halang. Sebelum ini semakan hanya
  # berjalan SELEPAS push ke main, jadi `main` hanya boleh didapati merah selepas kejadian:
  # PR #3 digabung, run #387 gagal pada main, dan pembetulan perlu PR kedua. Setiap PR ialah
  # pertaruhan, dan `main` yang merah bermakna amaran_ntfy sudah berbunyi untuk sesuatu yang
  # sepatutnya ditangkap sebelum ia mendarat.
  #
  # Laluan SENGAJA tidak ditapis di sini, tidak seperti pencetus push. Kegagalan #387 ialah
  # ujian unit yang dipecahkan oleh perubahan dalam `.github/workflows/` + `BacktestShariah2/`
  # — ia memang akan padan — tetapi penapis laluan pada PR bermakna sesetengah PR tiada check
  # LANGSUNG, dan "tiada check" kelihatan sama seperti "lulus" dalam UI gabungan. Pada push
  # penapis itu menjimatkan minit tanpa risiko kerana setiap push ke main akhirnya disemak;
  # pada PR ia mencipta lubang senyap tepat sebelum keputusan gabung.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Kumpulan mesti termasuk ref sejak `pull_request` ditambah (4 Nov 2026). Dengan kumpulan
  # tetap `semak-data` dan `cancel-in-progress`, push ke PR akan MEMBATALKAN semakan main yang
  # sedang berjalan — jadi menambah semakan PR akan melemahkan semakan main, bertentangan
  # dengan tujuannya. Satu baris per-ref mengekalkan penjimatan (push berturut pada PR yang
  # sama masih membatalkan yang lama) tanpa dua ref bertelagah.
  group: semak-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt -r requirements.txt
      - name: Semak pepijat kod (ruff; peraturan dalam ruff.toml)
        run: pip install -q ruff==0.16.9 && ruff check --output-format github .
      - name: Semak workflow (actionlint; tanpa shellcheck, nota gaya shell diabaikan)
        run: |
          mkdir -p /tmp/al
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 /tmp/al
          /tmp/al/actionlint -shellcheck= -color
      - name: Ujian unit
        run: python3 -m unittest discover -s BacktestShariah2/ujian
      - name: Semak data papertrade (sahkan.py)
        run: python3 BacktestShariah2/standard/sahkan.py
      - name: Saiz dokumen claude_N di bawah had db (pecah_claude.py)
        # `--gagal-pada 262144` = had KERAS db, bukan ambang pecah 240,000. CI mesti gagal apabila
        # dokumen benar-benar tidak boleh ditolak, bukan apabila ia sekadar patut dipecah - kerana
        # `pecah_claude.py --pecah` dalam harian.yml/beli.yml memang akan memecahnya pada larian
        # berjadual seterusnya. Gagal pada 240,000 bermakna CI berbunyi untuk kerja yang sudah
        # dijadualkan, dan amaran yang tidak boleh ditindaki melatih orang mengabaikan amaran.
        # Kalau ini gagal, maksudnya pemecah automatik TIDAK dapat mengikut - itu defek sebenar.
        run: python3 BacktestShariah2/standard/pecah_claude.py --gagal-pada 262144
      - name: Integriti Lejar Penuh (lejar.py semak)
        run: python3 BacktestShariah2/standard/lejar.py semak
      # Hanya arah "repo disunting tanpa diterbitkan". Arah bertentangan ("diterbitkan
      # tanpa dikomit", yang berlaku DUA KALI pada 30-31 Okt 2026) TIDAK boleh disemak di
      # sini: /api/artifacts/... dilindungi cabaran Cloudflare, jadi runner tidak dapat
      # membaca artifact hidup. Arah itu disemak setiap hari oleh jadual/tolak_db.md §7.
      - name: Dashboard selaras dengan terbitan terakhir (semak_terbit.py)
        run: python3 BacktestShariah2/standard/semak_terbit.py
