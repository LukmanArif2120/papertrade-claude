# Siasatan sekali guna (27 Okt 2026, senarai alat #81): sesi Claude tidak boleh capai optionstrategist.com.
# Muat turun halaman data volatiliti percuma, robots.txt dan halaman terma sebagai artifact (tiada commit) supaya
# format dan syarat penggunaan automatik dapat disemak sebelum skrip pengumpul ditulis. Padam selepas siasatan.
name: Siasat IV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  siasat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Muat turun
        run: |
          mkdir -p siasat && cd siasat
          UA="Mozilla/5.0 (papertrade-claude research)"
          for u in https://optionstrategist.com/calculators/free-volatility-data https://optionstrategist.com/robots.txt \
                   https://optionstrategist.com/terms-of-use https://optionstrategist.com/terms https://optionstrategist.com/privacy-policy; do
            f=$(echo "$u" | sed 's#https://##; s#[/:]#_#g')
            curl -sSL -m 30 -A "$UA" -o "$f" -w "$u %{http_code} %{size_download}\n" "$u" || echo "$u GAGAL"
          done
          # pautan fail data (txt/csv) dalam halaman
          grep -oiE 'href="[^"]+\.(txt|csv|xls|xlsx)"' optionstrategist.com_calculators_free-volatility-data | head -20 || true
      - name: Cetak ringkasan ke log
        run: |
          cd siasat
          echo "===== robots.txt"; cat optionstrategist.com_robots.txt
          python3 - <<'PY'
          import re, html
          t = open('optionstrategist.com_calculators_free-volatility-data', encoding='utf-8', errors='replace').read()
          print('===== pautan (href) berkaitan data'); [print(h) for h in sorted(set(re.findall(r'href="([^"]+)"', t))) if re.search(r'vol|data|download|txt|csv', h, re.I)][:40]
          print('===== tag pre/table:', len(re.findall(r'<pre', t, re.I)), len(re.findall(r'<table', t, re.I)))
          x = html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S | re.I))
          x = re.sub(r'<[^>]+>', '\n', x); baris = [b.strip() for b in x.splitlines() if b.strip()]
          print('===== baris teks:', len(baris))
          for i, b in enumerate(baris):
              if re.search(r'copyright|terms|permission|reproduc|redistribut|personal use|all rights', b, re.I):
                  print('TERMA', i, b[:300])
          k = next((i for i, b in enumerate(baris) if re.search(r'\bIV\b|implied|percentile|HV', b)), 0)
          print('===== contoh sekitar baris', k); [print(b[:200]) for b in baris[max(0, k - 15):k + 60]]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: siasat-iv
          path: siasat/
          retention-days: 3
