<title>Papan Backtest Shariah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Susun atur v3 (untuk pemula, 19 Okt 2026): tiga tab — Ringkasan, Kaedah, Posisi; pengepala melekit; helaian bawah untuk butiran.
   Gaya SST Terminal: navy gelap sahaja (pilihan sengaja, satu tema). */
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#0f172a; --card:#111a2e; --sunk:#0c1526; --line:#1f2a40; --line-2:#2a3852;
  --fg:#e2e8f0; --fg-2:#cbd5e1; --muted:#8a9ab3;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12); --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.16);
  --pos:#22c55e; --pos-soft:rgba(34,197,94,.14); --neg:#ef4444; --neg-soft:rgba(239,68,68,.13); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --guna:#22c55e; --guna-bg:rgba(34,197,94,.15); --uji:#f59e0b; --uji-bg:rgba(245,158,11,.15); --simpan:#60a5fa; --simpan-bg:rgba(96,165,250,.15); --tolak:#ef4444; --tolak-bg:rgba(239,68,68,.14);
  --ref:#eab308;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(45,212,191,.06),transparent 60%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
div.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
/* jalur di atas pengepala melekit (kawasan selamat telefon) */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent)}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pengepala */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.titlerow{display:flex;justify-content:space-between;gap:12px;flex-wrap:nowrap;align-items:flex-start}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;padding-top:2px}
.brand .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--violet));flex:none}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.kanan{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;flex:none;max-width:62%}
.kini{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;cursor:help}
.kini .kl{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kini b{font-size:.92rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.kini b.neg{color:var(--neg)}
.kini .kd{font-size:.74rem;color:var(--muted)}
.live{display:inline-flex;align-items:center;justify-content:flex-end;gap:6px;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
@media (max-width:520px){h1{font-size:1.02rem}#liveTxt{display:none}.kini b{font-size:.84rem}}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.95rem;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg-2)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),transparent 70%)}
.subbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* paparan */
section.view{padding-top:18px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet));flex:none}
h3{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0;max-width:80ch}
.headline{font-size:1rem;line-height:1.55;margin:0;max-width:110ch;color:var(--fg-2)}
.headline b{color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h .sub{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:grid;gap:3px;position:relative;overflow:hidden;align-content:start}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),var(--violet));opacity:.55}
.kpi .lbl{font-size:.72rem}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v .vs{font-size:.9rem;font-weight:500;color:var(--muted);margin:0 10px 0 5px;letter-spacing:0}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi .s b{color:inherit;font-weight:600}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:10px 11px}.kpi .v{font-size:1.3rem;white-space:normal}.kpi .v .vs{font-size:.8rem;margin-right:6px}}
.pill{display:inline-block;font-weight:600;font-size:.72rem;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.k-GUNA{background:var(--guna-bg);color:var(--guna)} .k-UJI{background:var(--uji-bg);color:var(--uji)}
.k-SIMPAN{background:var(--simpan-bg);color:var(--simpan)} .k-DITOLAK{background:var(--tolak-bg);color:var(--tolak)}
.p-buy{background:var(--pos-soft);color:var(--pos)} .p-hold{background:var(--simpan-bg);color:var(--simpan)} .p-exit{background:var(--neg-soft);color:var(--neg)} .p-near{background:var(--violet-soft);color:#c4b5fd} .p-mute{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.nw{white-space:nowrap}
.pg{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.78rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pg-GUNA{background:rgba(234,179,8,.16);color:#facc15}.pg-UJI{background:rgba(203,213,225,.13);color:#e2e8f0}.pg-SIMPAN{background:rgba(217,119,6,.16);color:#f59e0b}.pg-x{background:var(--neg-soft);color:var(--neg)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
svg .grid line{stroke:var(--line)}
.chartbox{width:100%;overflow:hidden}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.84rem;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=search],select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
select{max-width:100%}
.strip{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--fg-2)}
.strip b.t{color:var(--accent);letter-spacing:.06em;font-size:.74rem;text-transform:uppercase}
.strip span{flex:1 1 300px;min-width:0}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:8px}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}

/* Ringkasan */
.big{font-size:1rem;margin:0 0 6px;color:var(--fg-2)}
.big b{color:var(--fg)}
.kc{white-space:nowrap;margin-right:10px}
.lst{display:grid;margin-top:8px}
.lst button{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg-2);font:inherit;font-size:.9rem;padding:8px 6px;cursor:pointer}
.lst button:hover{background:var(--sunk)}
.lst .nm b{color:var(--fg);margin-right:6px}
.lst .ang{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:620px){.lst button{grid-template-columns:auto minmax(0,1fr)}.lst .ang{grid-column:1/-1;text-align:left;white-space:normal}}
.lnk{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
.eks{display:grid;gap:18px}
.ek{display:grid;gap:5px;font-size:.92rem;color:var(--fg-2)}
.ekh{font-weight:700;color:var(--fg)}
.ekr{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:5px 0}
.ekr>span:last-child{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

/* jadual boleh-susun */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);user-select:none}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--fg-2)}
th.l,td.l{text-align:left}
td{font-variant-numeric:tabular-nums lining-nums;color:var(--fg-2);vertical-align:middle}
th[data-k] span::after{content:" ↕";opacity:.3}
th[aria-sort="descending"] span::after{content:" ↓";opacity:1;color:var(--accent)}
th[aria-sort="ascending"] span::after{content:" ↑";opacity:1;color:var(--accent)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 92%,#fff 1.5%)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
tbody tr.click{cursor:pointer}
td.name{text-align:left;white-space:normal;min-width:200px;max-width:340px}
td.name b{font-weight:700;color:var(--fg);margin-right:6px}
td .vv{display:block;color:var(--muted);font-size:.76rem;line-height:1.3;white-space:nowrap}
td.name .vv,td.wrap .vv{white-space:normal}
td.wrap{white-space:normal;min-width:200px;max-width:380px;text-align:left}
td.tk b{color:var(--fg);font-weight:700}
.rkn{display:inline-block;min-width:1.7em;color:var(--muted);font-size:.78rem}
.tablefoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-top:8px}
.more{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.85rem}
/* telefon: setiap baris jadi kad dua lajur (label di atas nilai) */
@media (max-width:760px){
  .tablewrap{border:0;background:none;overflow:visible}
  .tablewrap table,.tablewrap tbody{display:block;width:100%}
  .tablewrap thead tr{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--sunk);border-radius:8px;margin-bottom:8px}
  .tablewrap thead th{display:block;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--card)}
  .tablewrap thead th:not([data-k]){display:none}
  .tablewrap tbody tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
  .tablewrap tbody td{display:block;text-align:left;border:0;padding:1px 0;background:none!important;white-space:normal;min-width:0;max-width:none}
  .tablewrap tbody td::before{content:attr(data-label);display:block;color:var(--muted);font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;line-height:1.4}
  .tablewrap tbody td[data-label=""]::before,.tablewrap tbody td.name::before{display:none}
  .tablewrap tbody td.name,.tablewrap tbody td.wrap,.tablewrap tbody td.full{grid-column:1/-1}
  .tablewrap tbody td .vv{white-space:normal}
}

/* gred dan lorong (helaian butiran) */
.gr{display:inline-block;min-width:1.45em;text-align:center;border-radius:4px;font-weight:700;font-size:.7rem;line-height:1.5;padding:0 3px;margin:0 2px 2px 0}
.gr small{font-weight:500;opacity:.75;margin-right:1px}
.grc{display:inline-flex;gap:8px;align-items:center;text-align:left;vertical-align:middle}
.grc>.gr{flex:none;display:flex;align-items:center;justify-content:center;min-width:2em;height:2.1em;margin:0;padding:0 6px;font-size:1.05rem;border-radius:6px}
.grt{min-width:0;display:flex;flex-direction:column;justify-content:center}.grt b{color:var(--fg)}.grt .pill{align-self:flex-start}
.grt .vv{display:block;color:var(--muted);font-size:.78rem;line-height:1.35}
.lrk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}.lrb{flex:none;display:flex;align-items:center;justify-content:center;height:1.8em;padding:0 7px;border-radius:6px;font-weight:700;font-size:.72rem;letter-spacing:.02em}.lrp{font-size:1.05rem;line-height:1.2;white-space:nowrap}.lrk b.lrp.pos{color:var(--pos)}.lrk b.lrp.neg{color:var(--neg)}.lrk b.lrp.mut{color:var(--muted)}
a.berita{color:var(--accent);text-decoration:none;margin-top:2px}a.berita:hover{text-decoration:underline}
.g-A{background:var(--pos-soft);color:var(--pos)}.g-B{background:var(--accent-soft);color:var(--accent)}.g-C{background:var(--sunk);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}.g-D{background:var(--warn-soft);color:var(--warn)}.g-E{background:var(--neg-soft);color:var(--neg)}.g-x{background:var(--sunk);color:var(--muted)}
.gl{display:grid}
.glr{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;font-size:.88rem}
.kad{display:grid;gap:4px;margin:8px 0}.kad div{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:.88rem;align-items:baseline}.kad .y{color:var(--pos);font-weight:700}.kad .n{color:var(--neg);font-weight:700}.kad .q{color:var(--muted)}

/* helaian butiran */
.scrim{position:fixed;inset:0;background:rgba(2,6,15,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;border-top:1px solid var(--line-2);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:780px;margin:0 auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
.sheet h3{font-size:1.25rem;font-weight:700;text-wrap:balance;margin-top:2px}
.sheet .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.close{float:right;border:0;background:var(--sunk);color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2);display:flex;gap:8px;align-items:center}
.sec h4::before{content:"";width:3px;height:11px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet));flex:none}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 14px;margin:0;font-size:.9rem}
.dl dt{color:var(--muted)}.dl dd{margin:0;color:var(--fg-2)}
@media (max-width:520px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:8px}.glr{grid-template-columns:96px minmax(0,1fr)}}
.ln{margin:6px 0;font-size:.9rem;color:var(--fg-2)}
.ln b{color:var(--fg)}
.gates{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.gate{font-size:.8rem;padding:4px 8px;border-radius:6px}
.gate.ok{color:var(--guna);background:var(--guna-bg)} .gate.no{color:var(--tolak);background:var(--tolak-bg)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px;margin:12px 0}
.m .k{font-size:.78rem;color:var(--muted)} .m .v{font-size:1.02rem;font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 48px;gap:8px;align-items:center;font-size:.86rem}
.bar .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:#04201c;font-weight:600;font-size:.88rem;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:var(--sunk);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:60}

/* tooltip istilah */
.tip{position:fixed;z-index:80;max-width:min(340px,calc(100vw - 16px));background:var(--surface);color:var(--fg);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:.86rem;line-height:1.5;pointer-events:none;overflow:hidden;text-transform:none;letter-spacing:0;font-weight:400}
.tip-h{background:var(--sunk);color:var(--accent);font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line)}
.tip-b{padding:8px 10px 4px;color:var(--fg-2)}
.tip-e{padding:4px 10px 9px;color:var(--muted)}
.tip-e b{color:var(--fg-2)}
.has-tip{text-decoration:underline dotted color-mix(in srgb,currentColor 50%,transparent);text-underline-offset:3px;cursor:help}
th.has-tip[data-k]{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="titlerow">

<script>
(function(){

const HARI=['5','10','15','20','30','40','60'];
const MAIN=['ringkasan','kaedah','posisi'];
const AKAUN={c:'Claude (maya)',m:'Moomoo lama',gab:'Semua'};
const S={tab:'ringkasan',ksub:'kedudukan',bt:'u1',set:'431',akaun:'c',docs:{},meta:null,live:false,
  f:{jenis:'semua',kep:new Set(),q:'',best:true,gaya:false,shown:40},
  ptm:null,ptmPeta:null,ptc:null,ptcN:{},mae:null,watch:null,hst:null,kat:null,at:{},af:{q:'',lane:'',shown:40},
  kf:{q:'',pingat:false,shown:30},pf:{st:'pegang',k:'',q:'',shown:50}};
try{const g=k=>localStorage.getItem(k);const t=g('pbs3_tab');if(MAIN.includes(t))S.tab=t;
  const ks=g('pbs3_ksub');if(['kedudukan','bt'].includes(ks))S.ksub=ks;const bt=g('pbs3_bt');if(['u1','u2'].includes(bt))S.bt=bt;
  const st=g('pbs3_set');if(SETS.includes(st))S.set=st;const ak=g('pbs3_akaun');if(AKAUN[ak])S.akaun=ak;}catch(e){}
/* pautan terus; pautan lama v2 dipetakan ke tab baharu */
{const h=(location.hash||'').slice(1);const map={ringkasan:['ringkasan'],kaedah:['kaedah','kedudukan'],backtest:['kaedah','bt'],posisi:['posisi'],
  keputusan:['kaedah','kedudukan'],butiran:['kaedah','bt'],papan:['kaedah','bt','u1'],banding:['kaedah','bt','u1'],autotune:['kaedah','bt','u2'],prestasi:['kaedah','kedudukan'],
  ptc:['posisi',0,0,'c'],ptm:['posisi',0,0,'m'],watchlist:['posisi',0,0,0,'hampir'],sektor:['ringkasan']};
  const m=map[h];if(m){S.tab=m[0];if(m[1])S.ksub=m[1];if(m[2])S.bt=m[2];if(m[3])S.akaun=m[3];if(m[4])S.pf.st=m[4];}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(x,d=1)=>x==null||isNaN(x)?'–':(x*100).toFixed(d)+'%';
const sgn=(x,d=1)=>x==null||isNaN(x)?'–':((x>0?'+':'')+(x*100).toFixed(d)+'%');
const sg2=v=>v==null||isNaN(v)?'–':(v>0?'+':'')+Number(v).toFixed(2)+'%';
const fx=(x,d=1)=>x==null||x===''||isNaN(x)?'–':Number(x).toFixed(d);
const nf=n=>n==null||isNaN(n)?'–':Number(n).toLocaleString('en-US');
const cls=v=>v==null||isNaN(v)?'':v>0?'pos':v<0?'neg':'';
const pill=k=>`<span class="pill ${KCLS[k]||''}">${esc(k)}</span>`;
const key=r=>r.id+'|'+r.varian;
const cmpId=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});
const TEMPOH=(Date.UTC(2026,9,2)-Date.UTC(2019,10,1))/86400000/365.25;
const jumlahDari=c=>c==null||isNaN(c)?null:Math.pow(1+c,TEMPOH)-1;
const avgOf=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
const BLN=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const tkO=t=>/^\d{4}-\d\d-\d\d/.test(t||'')?(+t.slice(8,10))+' '+BLN[+t.slice(5,7)-1]:'';
const tkP=t=>/^\d{4}-\d\d-\d\d/.test(t||'')?tkO(t)+' '+t.slice(0,4):'–';
const USD_POSISI=1000;
const usdTxt=u=>u==null||isNaN(u)?'–':(u<0?'−':'+')+'USD'+Math.abs(u).toLocaleString('en-US',{maximumFractionDigits:0});

/* memo: kira semula hanya bila objek sumber berubah (data langsung menggantikan objek dokumen) */
const memo=fn=>{let k=null,v;return (...d)=>{if(k&&d.length===k.length&&d.every((x,i)=>x===k[i]))return v;k=d;v=fn(...d);return v;};};
/* satu render bagi setiap bingkai walaupun banyak dokumen tiba serentak */
let tmR=0;const renderSoon=()=>{if(!tmR)tmR=setTimeout(()=>{tmR=0;renderAll();},30);};
function allRows(){const out=[];for(const d of Object.values(S.docs)){for(const r of (d.rows||[]))out.push(r);}return out;}
function rowsForSet(set){return allRows().filter(r=>r.set===set);}
function bench(set){const m=S.meta||{};return{ew:m.ew?.[set],spy:m.spy?.[set],qqq:m.qqq?.[set],ewmdd:m.ew_mdd?.[set]};}
function bestBy(rows,k){const by={};for(const r of rows){const b=by[r.id];if(!b||(r[k]??-1e9)>(b[k]??-1e9))by[r.id]=r;}return Object.values(by);}
function bestPerMethod(rows){const by={};for(const r of rows){const b=by[r.id];
  if(!b)by[r.id]=r;else{const rs=r.skor??-1,bs=b.skor??-1;if(rs>bs||(rs===bs&&(r.cagr??-9)>(b.cagr??-9)))by[r.id]=r;}}return Object.values(by);}

/* ================= komponen jadual boleh-susun (dikongsi) =================
   col: {k, t, tip, v(r)=nilai susun, f(r,i)=html sel, l=kiri, ns=tak boleh susun, c(r)=kelas sel} */
const SORT={},ST_R={};
function isNil(x){return x==null||x===''||(typeof x==='number'&&isNaN(x));}
function sortRows(rows,cols,st){const c=cols.find(c=>c.k===st.k);if(!c)return rows;const g=c.v||(r=>r[c.k]);
  return [...rows].sort((a,b)=>{const x=g(a),y=g(b),xn=isNil(x),yn=isNil(y);if(xn&&yn)return 0;if(xn)return 1;if(yn)return -1;
    if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y),undefined,{numeric:true})*st.dir;return (x-y)*st.dir;});}
function sortTable(o){
  const st=SORT[o.id]||(SORT[o.id]={k:o.def?o.def.k:null,dir:o.def?o.def.dir:-1});
  ST_R[o.id]=o.rerender||renderAll;
  let rows=st.k?sortRows(o.rows,o.cols,st):[...o.rows];const total=rows.length;
  if(o.limit)rows=rows.slice(0,o.limit);
  const th=o.cols.map(c=>`<th class="${c.l?'l':''}"${c.ns?'':` data-k="${c.k}" data-d="${c.l?'asc':'desc'}" aria-sort="${st.k===c.k?(st.dir<0?'descending':'ascending'):'none'}"`}${c.tip?` data-tip="${c.tip}"`:''}><span>${c.t}</span></th>`).join('');
  const tb=rows.map((r,i)=>`<tr${o.attr?' '+o.attr(r):''} class="${o.rcls?o.rcls(r):''}">${o.cols.map(c=>`<td class="${c.l?'l':''} ${c.c?c.c(r):''}">${c.f?c.f(r,i):esc(isNil(r[c.k])?'–':r[c.k])}</td>`).join('')}</tr>`).join('');
  return `<div class="tablewrap"><table data-st="${o.id}"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>${total?'':`<p class="empty">${o.empty||'Tiada data.'}</p>`}</div>`+(o.foot?o.foot(Math.min(total,rows.length),total):'');
}
document.addEventListener('click',e=>{const th=e.target.closest&&e.target.closest('table[data-st] th[data-k]');if(!th)return;
  const id=th.closest('table').dataset.st;const st=SORT[id];if(!st)return;const k=th.dataset.k;
  if(st.k===k)st.dir*=-1;else{st.k=k;st.dir=th.dataset.d==='asc'?1:-1;}(ST_R[id]||renderAll)();});
const kakiLagi=(id,step)=>(n,t)=>`<div class="tablefoot"><span>${nf(n)} daripada ${nf(t)}</span>${t>n?`<button type="button" class="more" id="${id}">Papar ${step} lagi</button>`:''}</div>`;
const bindLagi=(id,st,step)=>{const b=$('#'+id);if(b)b.onclick=()=>{st.shown+=step;renderAll();};};
/* kotak carian: lukis semula selepas berhenti menaip, kekalkan fokus */
function bindCari(id,set){const q=$('#'+id);if(!q)return;let tm;q.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{set(q.value.trim());renderAll();const n=$('#'+id);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},220);};}
const segHtml=(id,cur,opts,lbl)=>`<div class="seg" id="${id}" role="group"${lbl?` aria-label="${lbl}"`:''}>${opts.map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${cur===v}">${t}</button>`).join('')}</div>`;
const bindSeg=(id,f)=>{const s=$('#'+id);if(s)s.onclick=e=>{const b=e.target.closest('button');if(!b)return;f(b.dataset.v);renderAll();};};
const akaunSeg=id=>segHtml(id,S.akaun,Object.entries(AKAUN),'Akaun');
const bindAkaun=id=>bindSeg(id,v=>{S.akaun=v;S.kf.shown=30;S.pf.shown=50;save();});

/* ================= navigasi ================= */
function viewId(){return S.tab==='kaedah'?(S.ksub==='bt'?'v-bt':'v-kaedah'):'v-'+S.tab;}
function renderNav(){
  document.querySelectorAll('#mainTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $('#subBar').hidden=S.tab!=='kaedah';
  $('#subSeg').innerHTML=[['kedudukan','Kedudukan kaedah'],['bt','Backtest terperinci']].map(([v,t])=>`<button type="button" role="tab" data-sub="${v}" aria-selected="${S.ksub===v}">${t}</button>`).join('');
  const vid=viewId();document.querySelectorAll('section.view').forEach(v=>v.hidden=v.id!==vid);
}
function save(){try{localStorage.setItem('pbs3_tab',S.tab);localStorage.setItem('pbs3_ksub',S.ksub);localStorage.setItem('pbs3_bt',S.bt);localStorage.setItem('pbs3_set',S.set);localStorage.setItem('pbs3_akaun',S.akaun);}catch(e){}}
function pergi(tab,ksub){S.tab=tab;if(ksub)S.ksub=ksub;save();renderNav();renderAll();window.scrollTo({top:0});}
$('#mainTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;pergi(b.dataset.tab);};
$('#subSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;pergi('kaedah',b.dataset.sub);};
function setLive(on,txt){$('#dot').classList.toggle('on',on);$('#liveTxt').textContent=txt;}
/* tarikh tutup data: harian/status; jika kosong, harga_pada dokumen claude; jika masih kosong, tarikh beli/keluar terkini posisi C */
function tarikhData(){const h=S.hst||{},iso=t=>/^\d{4}-\d\d-\d\d/.test(t||'')?String(t).slice(0,10):'';
  let t=iso(h.harga_tutup_pada)||iso(h.tarikh_data_pagi)||iso(h.tarikh_data)||iso(S.ptc&&S.ptc.harga_pada);
  if(!t){const p=ptcRows();if(p)p.rows.forEach(r=>{[r.tarikh_beli,r.tarikh_keluar].forEach(x=>{x=iso(x);if(x>t)t=x;});});}
  return t;}
/* merah jika data tidak ditolak lebih 30 jam (Ahad–Selasa MYT: 74 jam, merentas hujung minggu) */
function renderData(){const mEl=$('#kiniMasa'),dEl=$('#kiniData');const td=tarikhData();mEl.textContent=td?tkP(td):'–';
  const t=S.hst&&(S.hst.dikemaskini||S.hst.kemaskini_pagi)||'';const m=/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(t);
  const kp=m?Date.UTC(+m[1],m[2]-1,+m[3],+m[4]-8,+m[5]):null;
  const hari=new Date(Date.now()+8*3600e3).getUTCDay();const had=(hari<=2?74:30)*3600e3;
  const basi=!kp||(Date.now()-kp>had);mEl.className=basi?'neg':'';
  dEl.innerHTML=`dikemas kini ${m?esc(tkO(t)+', '+m[4]+':'+m[5])+' MYT':'–'}${basi?' <span class="pill p-exit">lewat</span>':''}`;}

/* ================= data papertrade (lajur dan peraturan sama seperti v2) ================= */
function hariDari(t){if(!t)return null;const d=Date.parse(t+'T00:00:00Z');if(isNaN(d))return null;let n=0;const now=new Date();for(let x=new Date(d);x<now;x.setUTCDate(x.getUTCDate()+1)){const w=x.getUTCDay();if(w&&w<6)n++;}return Math.max(0,n-1);}
function benar(v){return v===true||v==='True'||v==='true';}
function nomb(v){return v==null||v===''||isNaN(+v)?null:+v;}
function normPT(r){const keluar=!!(r.keluar||r.tarikh_keluar);const kk=r.kaedah_kongsi;return Object.assign({},r,{
  kaedah_kongsi:Array.isArray(kk)?kk:typeof kk==='string'&&kk.trim()?kk.split(/[,;]\s*/).filter(Boolean):null,
  kaedah:r.kaedah||r.id_kaedah||'–',hari:r.tidak_dibeli?null:(r.hari??hariDari(r.tarikh_beli)),keluar,
  isyarat_keluar:r.isyarat_keluar||(keluar?'Keluar':'Pegang'),
  untung_akhir_pct:keluar?(r.untung_akhir_pct??r.untung_pct):null,
  harga_terkini:keluar&&r.harga_keluar!=null?r.harga_keluar:r.harga_terkini,tidak_sah:!!r.tidak_sah,
  keluar_henti:benar(r.keluar_henti),
  /* tutup sepenuhnya hanya apabila kedua-dua lorong keluar; tanpa data lorong 2 (baris lama) ikut lorong kaedah */
  tutup_semua:r.tutup_semua!=null&&r.tutup_semua!==''?benar(r.tutup_semua):(r.status_henti||r.keluar_henti!=null&&r.keluar_henti!=='')?keluar&&benar(r.keluar_henti):keluar,
  untung_henti_pct:nomb(r.untung_henti_pct),harga_keluar_henti:nomb(r.harga_keluar_henti)});}
/* dua lorong keluar (sejak 17 Okt 2026): 1 kaedah, 2 pegang selagi naik (standard/keluar_lorong.py) */
const LORONG={kaedah:['keluar','tarikh_keluar','harga_keluar','untung_akhir_pct','isyarat_keluar'],henti:['keluar_henti','tarikh_keluar_henti','harga_keluar_henti','untung_henti_pct','status_henti']};
/* untung lorong: akhir jika lorong itu sudah keluar, semasa jika masih dipegang */
const hasilL=(r,l)=>r[LORONG[l][0]]?r[LORONG[l][3]]:r.untung_pct;
/* hari dagangan (Isn–Jum) dari tarikh beli hingga tarikh keluar */
function hariAntara(a,b){const x=Date.parse((a||'')+'T00:00:00Z'),y=Date.parse((b||'')+'T00:00:00Z');if(isNaN(x)||isNaN(y)||y<x)return null;let n=0;for(let d=new Date(x+864e5);d<=y;d.setUTCDate(d.getUTCDate()+1)){const w=d.getUTCDay();if(w&&w<6)n++;}return n;}
/* satu blok bagi setiap lorong: status · tarikh @ harga · untung · sebab */
function selLorong(r,l){const [k,t,h,u,st]=LORONG[l];if(r.tidak_dibeli)return '<span class="mut">–</span>';
  const pct=v=>v==null?'<b class="lrp mut">–</b>':`<b class="lrp ${cls(v)}">${sg2(v)}</b>`;
  const kotak=(c,t,b)=>{const i=b.indexOf('</b>')+4;return `<div class="grc lr"><div class="lrk">${b.slice(0,i)}<span class="lrb ${c}">${t}</span></div><div class="grt">${b.slice(i)}</div></div>`;};
  if(r[k]){const hr=hariAntara(r.tarikh_beli,r[t]),sb=(r[st]||'').replace(/^Keluar:? ?/,'').replace(/ \([^)]*\)\s*$/,'');
    return kotak('p-exit','Keluar',`${pct(r[u])}<span class="vv nw">${esc(tkO(r[t]))} @ ${fx(r[h],2)}${hr!=null?' · '+hr+' hari':''}</span>${sb?`<span class="vv">${esc(sb)}</span>`:''}`);}
  if(!r[st])return kotak('p-mute','Belum',`${pct(r.untung_pct)}<span class="vv">belum dinilai</span>`);
  const tunggu=/menunggu/.test(r[st]),m=/\(([^)]*)\)\s*$/.exec(r[st]);
  return kotak(tunggu?'p-warn':'p-hold',tunggu?'Tunggu':'Pegang',`${pct(r.untung_pct)}${r[st]==='Pegang'?'':`<span class="vv">${esc(tunggu||!m?r[st].replace(/ \(menunggu\)$/,''):m[1])}</span>`}`);}
const sahSahaja=rs=>rs.filter(r=>!r.tidak_sah);
const ptmRowsM=memo(d=>d&&d.rows?{d,rows:d.rows.map(normPT)}:null);
function ptmRows(){return ptmRowsM(S.ptm&&S.ptm.rows&&S.ptm.rows.length?S.ptm:S.ptmPeta);}
const ptcRowsM=memo((...ds)=>{ds=ds.filter(d=>d&&d.rows&&d.rows.length);return ds.length?{d:S.ptc||ds[0],rows:ds.flatMap(d=>d.rows).map(normPT)}:null;});
function ptcRows(){return ptcRowsM(S.ptc,...Object.keys(S.ptcN).map(Number).sort((a,b)=>a-b).map(n=>S.ptcN[n]));}

/* gred pada hari isyarat (standard/gred.py) */
const GDIM=[['gred_sektor','S','Sektor','skor_sektor'],['gred_industri','I','Industri','skor_industri'],['gred_rs','R','RS','rs_rating'],['gred_pemangkin','P','Pemangkin','pemangkin'],['gred_qr','Q','Laporan suku (QR)','hari_ke_earnings']];
const GORD={A:0,B:1,C:2,D:3,E:4};
const grB=(g,lbl,tt)=>`<span class="gr g-${GORD[g]!=null?g:'x'}" title="${esc(tt||'')}">${lbl?`<small>${lbl}</small>`:''}${GORD[g]!=null?g:'–'}</span>`;
const adaGred=r=>GDIM.some(([k])=>GORD[r[k]]!=null);
const grNil=v=>v==null||v===''?null:Number(v);
const grSel1=(g,body)=>GORD[g]!=null?`<div class="grc">${grB(g)}<div class="grt">${body}</div></div>`:'<span class="mut">–</span>';
function grKump(r,jenis){const g=r[jenis==='Sektor'?'gred_sektor':'gred_industri'],sk=grNil(r[jenis==='Sektor'?'skor_sektor':'skor_industri']);
  const asal=jenis==='Sektor'?r.sektor:r.industri,us=jenis==='Sektor'?r.sektor_us:r.industri_us;
  if(GORD[g]==null)return asal?`<span>${esc(asal)}</span>`:'<span class="mut">belum</span>';
  return grSel1(g,`<span class="nw"><b>${sk==null?'–':fx(sk,0)}</b><span class="mut">/100</span></span><span class="vv">${esc(asal||us||'')}</span>`);}
/* skema RS 18 Okt 2026: A/B hanya jika disahkan (saham naik 12 bulan, SPY > SMA200, Mansfield > 0); rs_tanda = sebab/risiko */
function grRS(r){const v=grNil(r.rs_rating),t=String(r.rs_tanda||'');
  if(v==null)return grSel1(r.gred_rs,'<span class="mut">tiada data</span>');
  const sah=v>=80&&r.rs_sah==='ya'?'<span class="vv nw pos">disahkan</span>':v>=80&&r.rs_sah==='tidak'?'<span class="vv nw" style="color:var(--warn)">tidak disahkan</span>':'';
  const tt=t?`<span class="vv" style="color:var(--warn)">${esc(t.replace(/^tidak disahkan: /,''))}</span>`:'';
  return grSel1(r.gred_rs,`<b class="nw">RS ${fx(v,0)}</b><span class="vv">atasi ${fx(v,0)}% saham pasaran</span>${sah}${tt}`);}
function grPem(r){if(GORD[r.gred_pemangkin]==null)return `<span class="mut">${r.pemangkin&&r.pemangkin!=='belum dikumpul'?esc(r.pemangkin):'Belum dikumpul'}</span>`;
  let u=[];try{u=r.pemangkin_url?(typeof r.pemangkin_url==='string'?JSON.parse(r.pemangkin_url):r.pemangkin_url):[];}catch(e){u=[];}
  const ln=(Array.isArray(u)?u:[]).filter(x=>x&&/^https:\/\//.test(x.url||'')).slice(0,2).map(x=>`<a class="vv berita" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(x.tajuk||'Berita')}</a>`).join('');

/* ================= Prestasi papertrade setiap kaedah (peraturan sama seperti standard/harian_prestasi.py) ================= */
const KPT={TERUSKAN:{c:'--pos',cls:'p-buy',ik:'▲'},PERHATI:{c:'--warn',cls:'p-warn',ik:'●'},HENTIKAN:{c:'--neg',cls:'p-exit',ik:'✕'},'BELUM CUKUP DATA':{c:'--muted',cls:'p-mute',ik:'○'}};

const PR_MIN_N=5,PR_MIN_TUTUP=20;
const clamp01=x=>Math.max(0,Math.min(1,x));
const median=a=>{const v=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;};
const minOf=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?Math.min(...v):null;};
const kptPill=k=>`<span class="pill ${KPT[k].cls}" data-tip="keputusan_pr"><span aria-hidden="true">${KPT[k].ik}</span> ${k}</span>`;
function maeOf(r){const m=S.mae&&S.mae.rows;if(!m)return null;const v=m[`${r.akaun}|${r.saham}|${r.kaedah}|${r.tarikh_beli}`];return v==null?null:v;}
const prSrcM={};
function prSrc(which){return (prSrcM[which]||(prSrcM[which]=memo((M,C)=>{const tag=(p,a)=>p?sahSahaja(p.rows).map((r,i)=>Object.assign({},r,{akaun:a,_id:a+'|'+i})):[];
  const rows=which==='m'?tag(M,'M'):which==='c'?tag(C,'C'):[...tag(M,'M'),...tag(C,'C')];
  rows.forEach(r=>{r.hasil=r.keluar?r.untung_akhir_pct:r.untung_pct;r.mae=maeOf(r);if(r.mae==null&&r.hasil!=null)r.mae=Math.min(0,r.hasil);});return rows;})))(ptmRows(),ptcRows(),S.mae);}
/* statistik setiap kaedah + skor Untung×Selamat + keputusan */
function prStats(rows){const by={};rows.forEach(r=>{(by[r.kaedah]=by[r.kaedah]||[]).push(r);});
  return Object.entries(by).map(([k,a])=>{const v=a.map(r=>r.hasil).filter(x=>x!=null);const rugi=v.filter(x=>x<0);const ex=a.filter(r=>r.keluar);
    const exr=ex.filter(r=>(r.untung_akhir_pct??0)<0);
    const o={kaedah:k,n:a.length,win:v.length?v.filter(x=>x>0).length/v.length*100:null,avg:avgOf(v),med:median(v),worst:minOf(v),
      worstSaham:(a.find(r=>r.hasil===minOf(v))||{}).saham,gagal:v.length?rugi.length/v.length*100:null,avgRugi:rugi.length?avgOf(rugi):0,
      ex:ex.length,exrugi:exr.length,exrugiAvg:exr.length?avgOf(exr.map(r=>r.untung_akhir_pct)):null,hari:avgOf(a.map(r=>r.hari)),
      maeAvg:avgOf(a.map(r=>r.mae)),maeMin:minOf(a.map(r=>r.mae)),
      lk:avgOf(a.map(r=>hasilL(r,'kaedah'))),lh:avgOf(a.map(r=>hasilL(r,'henti'))),xh:a.filter(r=>r.keluar_henti).length};
    const U=0.6*clamp01(((o.avg??0)+5)/15)+0.4*((o.win??0)/100);
    const Sf=0.6*clamp01(1+(o.maeAvg??0)/10)+0.4*clamp01(1+(o.worst??0)/20);
    o.U=U;o.Sf=Sf;o.yakin=Math.min(1,o.n/PR_MIN_N);o.skor=Math.round(100*U*Sf*o.yakin);
    if(o.ex<PR_MIN_TUTUP)o.kep='BELUM CUKUP DATA';
    else if((o.avg??0)<=-3||(o.gagal??0)>=75||o.skor<25)o.kep='HENTIKAN';
    else if(o.skor>=55&&(o.avg??0)>0)o.kep='TERUSKAN';else o.kep='PERHATI';
    o.amaran=[];if(o.n>=3&&o.gagal>=60)o.amaran.push(fx(o.gagal,0)+'% dagangan rugi');if(o.worst!=null&&o.worst<=-8)o.amaran.push('satu dagangan rugi '+sg2(o.worst)+' ('+(o.worstSaham||'')+')');
    if(o.exrugi>=3)o.amaran.push(o.exrugi+' jualan rugi');if(o.maeMin!=null&&o.maeMin<=-10)o.amaran.push('pernah turun '+sg2(o.maeMin));

const prStatsC=new WeakMap();

function drawPegang(box,series){

  let ymin=Math.min(0,...vals),ymax=Math.max(11,...vals);ymin=Math.floor(ymin/2)*2;ymax=Math.ceil(ymax/2)*2;

  const X=i=>P.l+(HARI.map(Number)[i]-5)/55*(W-P.l-P.r),Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);

  let ln='';series.forEach(s=>{const pts=HARI.map((h,i)=>s.r.pegang?.[h]!=null?[X(i),Y(s.r.pegang[h]),s.r.pegang[h]]:null).filter(Boolean);
    ln+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(${s.col})" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach(p=>ln+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(${s.col})"><title>${p[2].toFixed(1)}%</title></circle>`);

  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Profil pegangan">${g}${ref}${ln}${t}</svg>`;
}

  usd_sama:{t:'Jika USD1,000 setiap belian',d:'Untung bersih jika setiap belian bernilai USD1,000 (sama berat). Rekod sebenar 1 unit; ini cara kiraan supaya saham mahal tidak mendominasi.',e:'3 belian +10%, −5%, +2% = +USD70.'},
  keputusan_pr:{t:'Keputusan papertrade',d:'Diberi selepas 20 dagangan selesai (sudah dijual). TERUSKAN: skor Untung×Selamat ≥ 55 dan untung purata positif. HENTIKAN: untung purata ≤ −3%, atau ≥ 75% dagangan rugi, atau skor < 25. PERHATI: di antaranya. Sebelum 20: BELUM CUKUP DATA.',e:'Keputusan papertrade sahaja, bukan isyarat wang sebenar.'},
  dagangan:{t:'Dagangan',d:'Selesai = sudah dijual ikut peraturan kaedah. Kaedah dinilai selepas 20 dagangan selesai.',e:'36 selesai daripada 57 = 21 masih dipegang.'},
  kaedah_pt:{t:'Kaedah',d:'Kod kaedah yang memberi isyarat beli (M01–M161). Ketik untuk melihat cara ia beli dan jual.',e:''},
  kp_pingat:{t:'Backtest',d:'Keputusan ujian atas data lama bagi varian yang sedang digunakan. Pingat hanya jika lulus ketujuh-tujuh langkah saringan: 🥇 Emas = GUNA, 🥈 Perak = UJI KERTAS, 🥉 Gangsa = SIMPAN. Jika tidak, ditunjuk langkah pertama yang gagal.',e:'✗ langkah 2 = untung kalah kepada SPY.'},
  kp_saringan:{t:'Saringan 7 langkah',d:'1–5: Ujian 1 (431 saham Shariah, 2019–2026; gate enjin G2, G3, G4, G1, G5). 6: varian sama untung dalam keempat-empat kumpulan kecil S1–S4. 7: Ujian 2 (2000 saham AS lain, 2013–2018, parameter asal) masih untung dalam kumpulan A dan B.',e:'✓ lulus · ✗ gagal · ? tiada data.'},
  skor_us:{t:'Skor Untung×Selamat (0–100)',d:'100 × U × S. U = 0.6 × untung purata (−5% → 0, +10% → 1) + 0.4 × kadar menang. S = 0.6 × penurunan maks purata (−10% → 0, 0% → 1) + 0.4 × rugi terbesar (−20% → 0, 0% → 1). Kurang daripada 5 dagangan didarab n/5.',e:'U 0.8 × S 0.9 = 72.'},
  kerugian_terbesar:{t:'Rugi terbesar',d:'Untung paling rendah bagi satu dagangan (akhir atau semasa).',e:''},
  penurunan_maks:{t:'Penurunan maksimum',d:'Harga rendah terendah sejak beli (hingga hari ini atau hingga dijual) ÷ harga beli − 1. Lebih hampir 0 = lebih selamat.',e:'Beli 100, pernah jatuh ke 94 = −6%, walaupun kini untung.'},
  dua_lorong:{t:'Dua cara jual',d:'Setiap posisi dinilai serentak dengan dua cara jual dari harga beli yang sama. 1 Ikut kaedah: peraturan penuh kaedah (keputusan rasmi). 2 Pegang selagi naik: jual pada buka esok apabila harga tutup jatuh bawah paras keluar (tutup tertinggi sejak beli − 4×ATR14; paras hanya naik).',e:'Kaedah +1.2% · selagi naik +2.5% = memegang selagi naik lebih untung setakat ini.'},
  isyarat_keluar:{t:'Cara jual 1 · ikut kaedah',d:'Peraturan keluar penuh kaedah: henti rugi, sasaran untung, isyarat jual (jual pada buka esok) atau had masa. Ini keputusan rasmi papertrade.',e:'Keluar 15 Okt @ 20.50 · capai sasaran.'},
  keluar_henti:{t:'Cara jual 2 · pegang selagi naik',d:'Paras keluar = tutup tertinggi sejak beli tolak 4 × ATR14 (purata julat harian 14 hari); paras hanya naik. Jual pada buka esok apabila harga tutup di bawah paras keluar. Henti rugi kaedah tidak dipakai di sini.',e:'Paras keluar 102.00; puncak 110.00 = jual jika tutup bawah 102.00.'},
  status_pos:{t:'Status',d:'Dipegang: belum kena peraturan jual kaedah. Akan dijual: isyarat jual pada tutup terakhir, dijual pada buka sesi seterusnya. Dijual: tarikh @ harga jual dan sebabnya.',e:'Dijual 14 Okt @ 78.25 · kena henti rugi · 3 hari.'},
  tarikh_beli:{t:'Beli',d:'Tarikh dan harga beli: harga buka sebenar pada hari dagangan selepas isyarat.',e:''},
  saham:{t:'Saham',d:'Simbol saham AS.',e:''},
  untung_pct:{t:'Untung',d:'Harga terkini ÷ harga beli − 1. Bagi posisi yang sudah dijual: untung pada harga jual. Angka kecil = harga terkini atau harga jual.',e:'+5.0% = USD100 kini bernilai USD105.'},
  pct_dipenuhi:{t:'% hampir',d:'Sejauh mana isyarat beli hampir lengkap: 100 − jarak ke paras pencetus (%). Hanya calon 90–100% dipapar.',e:'99% = pencetus tinggal 1% lagi.'},
  syarat_belum:{t:'Syarat yang tinggal',d:'Syarat terakhir yang belum dipenuhi dan paras harga tutup yang melengkapkan isyarat.',e:''},
  gred:{t:'Gred',d:'Gred A–E pada hari isyarat. Gred keseluruhan = purata Industri, Pemangkin dan QR (A=4 … E=0). Direkod untuk diuji; belum terbukti dan tidak menapis belian.',e:''},
  g_s:{t:'Sektor',d:'Kekuatan sektor saham itu pada hari isyarat: peratus saham sektor di atas purata 200 hari, dipangkat antara 11 sektor (A > 80 … E ≤ 20). Paparan sahaja: kajian mendapati ia tidak membantu memilih saham.',e:''},
  g_i:{t:'Industri',d:'Kekuatan industri saham itu pada hari isyarat berbanding ~141 industri: trend Weinstein dan pulangan sebulan (A > 80 … E ≤ 20). Kajian 2019–2026: industri A sedikit lebih baik, E lebih lemah. Tidak terpakai bagi kaedah pantulan.',e:'B 73/100 = industri kuat, tetapi bukan 20% teratas.'},
  g_r:{t:'RS',d:'Kekuatan harga saham berbanding seluruh pasaran AS (1–99). A/B hanya jika disahkan: saham naik dalam 12 bulan, SPY di atas purata 200 hari dan garis RS di atas purata 52 minggu.',e:'RS 92 disahkan = antara 8% saham terkuat ketika pasaran naik.'},
  g_q:{t:'Laporan suku (QR)',d:'Hari dagangan sebelum syarikat mengumumkan laporan suku. Harga boleh melompat pada hari laporan, melepasi henti rugi. A = lebih 21 hari atau tiada laporan dalam 30 hari; E = 5 hari atau kurang.',e:'E · 4 hari lagi = laporan jatuh dalam tempoh pegang.'},
  g_p:{t:'Pemangkin',d:'Laporan pendapatan akan datang (6–21 hari +2, 1–5 hari +1) atau reaksi besar selepas laporan (≥ +20% lawan pasaran, +3/+4). Berita pencairan saham atau keputusan FDA menghadkan gred. A ≥ 3 mata, D = tiada pemangkin.',e:'"earnings 12 hari dagangan lagi +2" = B.'},
  g_k:{t:'Kewangan',d:'Keadaan kewangan syarikat daripada penyata suku: K kekukuhan, U keuntungan, T pertumbuhan, S arah suku terkini; dengan jarak had Syariah. Rekod sahaja; belum diuji.',e:'B (K:A U:B T:C S:B) · Syariah lulus.'},
  kaedah:{t:'Kaedah / varian',d:'Kod dan nama kaedah. M = kaedah dagangan lengkap. I = satu indikator sahaja (keluar apabila tutup di bawah SMA20). Baris kecil ialah varian, iaitu variasi tetapan bagi kaedah yang sama.',e:''},
  keputusan:{t:'Keputusan enjin',d:'Penilaian enjin v1.2. DITOLAK jika gagal walau satu gate. Jika lulus semua gate: GUNA (skor ≥ 75 dan atasi QQQ di kedua-dua separuh), UJI KERTAS (skor 60–75) atau SIMPAN (skor < 60).',e:'Skor 80 tetapi gagal G4 tetap DITOLAK.'},
  skor:{t:'Skor (0–100)',d:'Markah gabungan, hanya jika lulus semua gate: CAGR lawan SPY/QQQ (25), MAR (20), tahun atasi SPY (15), keseimbangan dua separuh (10), tutup ≥ +10% (15), kekerapan dan tempoh dagangan (10), untung purata setiap dagangan (5).',e:''},
  jumlah:{t:'Jumlah untung',d:'Keuntungan keseluruhan modal portfolio dari 1 Nov 2019 hingga 2 Okt 2026 (6.9 tahun), 8 slot × 12.5% modal. Dikira daripada CAGR.',e:'+100% = modal menjadi dua kali ganda.'},
  cagr:{t:'CAGR',d:'Kadar pertumbuhan tahunan purata modal portfolio (8 slot × 12.5%), selepas kos dagangan 0.1%.',e:'CAGR 40%: RM10,000 → RM14,000 selepas setahun.'},
  win:{t:'Kadar menang',d:'Peratus entry yang ditutup dengan untung. Untuk cara jual-cepat-bila-rugi, 30–40% adalah normal asalkan purata menang jauh lebih besar daripada purata kalah.',e:''},
  n:{t:'Jumlah entry',d:'Bilangan dagangan dari Nov 2019 hingga Okt 2026 bagi semua saham dalam set. Kurang daripada 100 gagal gate G2.',e:''},
  avg:{t:'Untung/dagangan',d:'Purata untung bersih setiap entry selepas kos 0.1%, termasuk yang rugi.',e:''},
  avgwin:{t:'Purata menang',d:'Purata untung bagi entry yang untung sahaja.',e:''},
  avgloss:{t:'Purata kalah',d:'Purata rugi bagi entry yang rugi sahaja. Gate G1 menolak purata kalah lebih teruk daripada −12%.',e:''},
  nisbah:{t:'Menang:kalah',d:'Purata menang dibahagi saiz purata kalah.',e:'4.0× dengan menang 38%: 0.38 × 4.0 = 1.52 > 0.62, jadi untung secara purata.'},
  days:{t:'Hari pegang',d:'Purata hari dagangan sesuatu saham dipegang, dari isyarat beli hingga dijual.',e:'20 hari dagangan ≈ sebulan.'},
  harian:{t:'Untung/hari',d:'Untung/dagangan dibahagi hari pegang.',e:''},
  mdd:{t:'MDD (kejatuhan maksimum)',d:'Penurunan paling besar nilai portfolio dari puncak ke lembah. Gate G4 menolak MDD lebih teruk daripada −45%.',e:'−42% = modal pernah jatuh dari RM20,000 ke RM11,600 sebelum pulih.'},
  mar:{t:'MAR',d:'CAGR dibahagi saiz MDD: pulangan bagi setiap unit risiko kejatuhan.',e:''},
  ret10:{t:'Tutup ≥ +10%',d:'Peratus entry yang dijual dengan untung sekurang-kurangnya 10%.',e:''},
  hit10:{t:'Sentuh +10%',d:'Peratus entry yang harganya pernah naik 10% atau lebih semasa dipegang.',e:''},
  bulan10:{t:'Bulan ≥ +10%',d:'Peratus bulan nilai portfolio naik 10% atau lebih.',e:''},
  bulan_untung:{t:'Bulan untung',d:'Peratus bulan nilai portfolio naik.',e:''},
  pf:{t:'PF (faktor untung)',d:'Jumlah semua untung dibahagi jumlah semua rugi. Melebihi 1 = untung bersih.',e:''},
  dagangan_setahun:{t:'Dag/thn',d:'Purata bilangan entry setahun bagi semua saham dalam set.',e:''},
  h1:{t:'Separuh 1',d:'CAGR bagi Nov 2019 hingga Dis 2022 (termasuk kejatuhan 2020 dan 2022).',e:''},
  h2:{t:'Separuh 2',d:'CAGR bagi Jan 2023 hingga 2 Okt 2026.',e:''},
  thn_kalah_spy:{t:'Tahun atasi SPY',d:'Peratus tahun kalendar penuh (2020–2025) kaedah atasi SPY.',e:''},
  terburuk:{t:'Dagangan terburuk',d:'Rugi paling besar bagi satu entry. Boleh melebihi henti rugi jika harga dibuka jauh lebih rendah.',e:''},
  gate:{t:'Gate gagal',d:'G1 henti rugi & purata kalah ≥ −12%; G2 ≥ 100 entry; G3 CAGR atasi SPY; G4 MDD tidak lebih teruk daripada −45%; G5 untung di kedua-dua separuh; G6 beli sahaja & mekanikal.',e:''},
  menang_ew:{t:'Atasi beli semua',d:'Sama ada CAGR kaedah melebihi CAGR membeli semua saham dalam set dengan modal sama rata.',e:''},
  pegang:{t:'Profil pegangan',d:'Pulangan purata jika setiap entry dipegang tepat 5, 10 … 60 hari dari harga masuk, tanpa peraturan jual.',e:''},
  gaya:{t:'Gaya saya',d:'Penapis: purata pegangan ≤ 40 hari dan sekurang-kurangnya 100 entry, disusun ikut untung/dagangan.',e:''},
  set:{t:'Set saham',d:'431 = semua saham Shariah dalam ujian. S1–S4 = empat kumpulan kecil (≈108 saham setiap satu) daripada 431.',e:''},
  at_lorong:{t:'Lorong',d:'had60: enjin menutup dagangan selepas 60 hari pegang. asal: keluar ikut peraturan asal kaedah.',e:''},
  at_menang:{t:'Kadar menang A / B',d:'Peratus dagangan portfolio yang untung selepas kos, bagi saham kumpulan A dan B (2013–2018).',e:''},
  at_oos2:{t:'CAGR A / B (2013–2018)',d:'Untung setahun portfolio atas saham kumpulan A dan B. Hijau = mengatasi SPY dalam tempoh sama.',e:''},
  at_dag:{t:'Dagangan A / B',d:'Bilangan dagangan yang dibeli oleh portfolio (8 slot × 12.5%) bagi setiap kumpulan saham; hari = purata hari pegang.',e:''},
  at_skor_sar:{t:'Lebihan min',d:'Nilai lebih kecil antara (CAGR A − SPY) dan (CAGR B − SPY). Positif = mengatasi SPY dalam kedua-dua kumpulan.',e:''}
};
const TIPLBL={'jumlah untung':'jumlah','cagr':'cagr','kadar menang':'win','jumlah entry':'n','untung/dagangan':'avg','purata untung':'avgwin','purata rugi':'avgloss','menang:kalah':'nisbah','purata hari pegang':'days','untung/hari':'harian','mdd':'mdd','mar':'mar','tutup ≥ +10%':'ret10','sentuh +10%':'hit10','bulan ≥ +10%':'bulan10','bulan untung':'bulan_untung','faktor untung':'pf','dagangan setahun':'dagangan_setahun','separuh 1 (2019–22)':'h1','separuh 2 (2023–)':'h2','tahun atasi spy':'thn_kalah_spy','dagangan terburuk':'terburuk','atasi beli semua':'menang_ew'};
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);
function applyTips(root){if(!root)return;
  root.querySelectorAll('[data-tip]').forEach(el=>el.classList.add('has-tip'));
  root.querySelectorAll('.m .k').forEach(el=>{if(el.dataset.tip)return;const k=TIPLBL[(el.textContent||'').trim().toLowerCase()];if(k&&TIPS[k]){el.dataset.tip=k;el.classList.add('has-tip');}});}
function showTip(el){const T=TIPS[el.dataset.tip];if(!T)return;
  tipEl.innerHTML=`<div class="tip-h">${esc(T.t)}</div><div class="tip-b">${esc(T.d)}</div>${T.e?`<div class="tip-e"><b>Contoh:</b> ${esc(T.e)}</div>`:'<div style="height:6px"></div>'}`;
  tipEl.hidden=false;const r=el.getBoundingClientRect(),W=tipEl.offsetWidth,H=tipEl.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-W/2),vw-W-8),y=r.bottom+8;if(y+H>vh-8)y=Math.max(8,r.top-H-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';}
function hideTip(){tipEl.hidden=true;}
let tipTimer=null,tipSuppress=false;
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest&&e.target.closest('[data-tip]');hideTip();if(!el)return;tipTimer=setTimeout(()=>{tipSuppress=true;showTip(el);},450);},true);
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='pointermove'&&e.pointerType==='touch'&&tipTimer&&(Math.abs(e.movementX)+Math.abs(e.movementY))<3)return;clearTimeout(tipTimer);tipTimer=null;},true));
document.addEventListener('click',e=>{if(tipSuppress){tipSuppress=false;e.preventDefault();e.stopPropagation();}},true);
window.addEventListener('scroll',hideTip,{passive:true});
applyTips(document.querySelector('header.top'));

renderNav();renderAll();

/* ================= data langsung ================= */
(async function connect(){
  const db=window.claude?.use?await window.claude.use('db'):null;
  if(!db){setLive(false,'Data langsung tidak tersedia di paparan ini');S.live=true;renderAll();return;}
  db.collection('registry').limit(1000).onSnapshot(snap=>{
    const d={};snap.docs.forEach(x=>{if(!x.exists)return;const v=x.data();d[x.id]=Object.assign({},v,{rows:(v.rows||[]).map(r=>Object.assign({},r,{jumlah:jumlahDari(r.cagr),nisbah:(r.avgwin!=null&&r.avgloss<0)?r.avgwin/-r.avgloss:null,harian:(r.avg!=null&&r.days>0)?r.avg/r.days:null}))});});S.docs=d;
    S.live=true;setLive(true,'Langsung');renderSoon();
  },()=>setLive(false,'Sambungan terputus. Muat semula halaman.'));
  db.doc('meta/info').onSnapshot(s=>{S.meta=s.exists?s.data():null;renderSoon();},()=>{});
  const sub=(path,keyName)=>db.doc(path).onSnapshot(s=>{S[keyName]=s.exists?s.data():null;S.live=true;renderSoon();},()=>{});
  sub('papertrade/moomoo','ptm');
  sub('papertrade/moomoo_peta','ptmPeta');
  sub('papertrade/claude','ptc');
  /* papertrade/claude_2, _3, … tanpa had: dokumen yang wujud membuka langganan dua nombor seterusnya */
  const ptcDah=new Set();
  const subPtc=n=>{if(ptcDah.has(n))return;ptcDah.add(n);db.doc('papertrade/claude_'+n).onSnapshot(s=>{S.ptcN[n]=s.exists?s.data():null;S.live=true;if(s.exists){subPtc(n+1);subPtc(n+2);}renderSoon();},()=>{});};
  subPtc(2);subPtc(3);
  /* dokumen besar dibahagi (standard/bahagi_db.py): asas {bahagian:{id,n}} + <nama>_2… {induk,bahagian,rows}; bahagian lama (induk lain) diabaikan */
  const subBhg=(path,keyName)=>{let asas=null;const ch={},dah=new Set();
    const gabung=()=>{let d=null;if(asas){const b=asas.bahagian;let rows=asas.rows||[];
        if(b&&b.n>1)for(let i=2;i<=b.n;i++){const c=ch[i];if(c&&c.induk===b.id)rows=rows.concat(c.rows||[]);}
        d=Object.assign({},asas,{rows});}
      S[keyName]=d;S.live=true;renderSoon();};
    db.doc(path).onSnapshot(s=>{asas=s.exists?s.data():null;const n=asas&&asas.bahagian?asas.bahagian.n:1;
      for(let i=2;i<=n;i++){if(dah.has(i))continue;dah.add(i);db.doc(path+'_'+i).onSnapshot(t=>{ch[i]=t.exists?t.data():null;gabung();},()=>{});}
      gabung();},()=>{});};
  subBhg('papertrade/watchlist','watch');
  sub('harian/status','hst');
  sub('prestasi/mae','mae');
  sub('kaedah/katalog','kat');
  /* Ujian 2 (a02_saringan) dan nama kaedah (kaedah_<ID>) daripada koleksi autotune */
  db.collection('autotune').limit(1000).onSnapshot(snap=>{const d={};snap.docs.forEach(x=>{if(x.exists)d[x.id]=x.data();});S.at=d;S.live=true;renderSoon();},()=>{});
})();
})();
</script>
