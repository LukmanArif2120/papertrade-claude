<title>Papan Backtest Shariah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Susun atur: konsol terminal satu lajur; pengepala melekit (tab utama + sub-tab), paparan bertab, helaian bawah untuk butiran.
   Gaya SST Terminal: navy gelap sahaja (pilihan sengaja, satu tema). */
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#0f172a; --card:#111a2e; --sunk:#0c1526; --line:#1f2a40; --line-2:#2a3852;
  --fg:#e2e8f0; --fg-2:#cbd5e1; --muted:#8a9ab3;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12); --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.16);
  --pos:#22c55e; --pos-soft:rgba(34,197,94,.14); --neg:#ef4444; --neg-soft:rgba(239,68,68,.13); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --guna:#22c55e; --guna-bg:rgba(34,197,94,.15); --uji:#f59e0b; --uji-bg:rgba(245,158,11,.15); --simpan:#60a5fa; --simpan-bg:rgba(96,165,250,.15); --tolak:#ef4444; --tolak-bg:rgba(239,68,68,.14);
  --ref:#eab308;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(45,212,191,.06),transparent 60%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
div.wrap{max-width:none;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent)}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pengepala */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 0}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--violet));flex:none}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live{flex-wrap:wrap;row-gap:2px}
.gr{display:inline-block;min-width:1.45em;text-align:center;border-radius:4px;font-weight:700;font-size:.7rem;line-height:1.5;padding:0 3px;margin:0 2px 2px 0}
.gr small{font-weight:500;opacity:.75;margin-right:1px}
.nw{white-space:nowrap}
/* jadual bergred: angka dan perkataan tidak dipecah; skrol mendatar dalam jadual jika terlalu lebar */
.tablewrap.tw-grd{overflow-x:auto}.tablewrap.tw-grd td,.tablewrap.tw-grd th{overflow-wrap:break-word;padding-inline:4px}
td.grd{min-width:0}.tablewrap.tw-grd td.wrap{min-width:150px}td.grd .vv{font-size:.72rem}td.grp{min-width:320px}.tablewrap td .nw{white-space:nowrap}
.grc{display:inline-flex;gap:8px;align-items:center;text-align:left;vertical-align:middle}
.grc>.gr{flex:none;display:flex;align-items:center;justify-content:center;min-width:2em;height:2.1em;margin:0;padding:0 6px;font-size:1.05rem;border-radius:6px}
.lrk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}.lrb{flex:none;display:flex;align-items:center;justify-content:center;height:1.8em;padding:0 7px;border-radius:6px;font-weight:700;font-size:.72rem;letter-spacing:.02em}.lrp{font-size:1.05rem;line-height:1.2;white-space:nowrap}.lrk b.lrp.pos{color:var(--pos)}.lrk b.lrp.neg{color:var(--neg)}.lrk b.lrp.mut{color:var(--muted)}
.grt{min-width:0;display:flex;flex-direction:column;justify-content:center}.grt b{color:var(--fg)}.grt .pill{align-self:flex-start}
td.grd{text-align:center;vertical-align:middle}
@media (min-width:761px){td.kdh{width:1%;max-width:76px;white-space:normal}td.kdh .vv{white-space:normal;overflow-wrap:normal}}
td.ctr,th[data-tip="hari_watch"],th[data-tip="hari_pt"]{text-align:center}
.tablewrap.tw-grd td{vertical-align:middle}
.tablewrap.tw-grd th[data-tip^="g_"],.tablewrap.tw-grd th[data-tip="gred"]{text-align:center}
td.grd .vv.nm1{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:110px;overflow-wrap:normal}
a.berita{color:var(--accent);text-decoration:none;margin-top:2px}a.berita:hover{text-decoration:underline}
.g-A{background:var(--pos-soft);color:var(--pos)}.g-B{background:var(--accent-soft);color:var(--accent)}.g-C{background:var(--sunk);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}.g-D{background:var(--warn-soft);color:var(--warn)}.g-E{background:var(--neg-soft);color:var(--neg)}.g-x{background:var(--sunk);color:var(--muted)}
/* kemas kini terakhir (atas kanan) */
.titlerow{flex-wrap:nowrap;align-items:flex-start}
.brand{flex:1 1 auto;padding-top:2px}
.kanan{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;flex:none;max-width:62%}
.kini{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;cursor:help}
.kini .kl{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kini b{font-size:.92rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.kini b.neg{color:var(--neg)}
.kini .kd{font-size:.74rem;color:var(--muted)}
.kanan .live{justify-content:flex-end}
@media (max-width:520px){h1{font-size:1.02rem}#liveTxt{display:none}.kini b{font-size:.84rem}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg-2)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),transparent 70%)}
.subbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}
.subbar[hidden]{display:none}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spacer{flex:1}
.fold-btn{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.82rem;padding:6px 10px;border-radius:6px;cursor:pointer}
.fold-btn:hover{border-color:var(--line-2)}

/* paparan */
section.view{padding-top:18px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet));flex:none}
h3{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0;max-width:80ch}
.headline{font-size:1rem;line-height:1.55;margin:0;max-width:120ch;color:var(--fg-2)}
.headline b{color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h .sub{margin:0}
.panel-h.foldable{cursor:pointer;user-select:none}
.panel-h.foldable::after{content:"▾";color:var(--muted);font-size:.9rem;margin-left:4px}
.panel.lipat>:not(.panel-h){display:none!important}
.panel.lipat>.panel-h{margin-bottom:-14px;border-bottom:0}
.panel.lipat>.panel-h::after{content:"▸"}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:grid;gap:3px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),var(--violet));opacity:.55}
.kpis6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .lbl{font-size:.72rem}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;font-weight:600;font-size:.72rem;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.k-GUNA{background:var(--guna-bg);color:var(--guna)} .k-UJI{background:var(--uji-bg);color:var(--uji)}
.k-SIMPAN{background:var(--simpan-bg);color:var(--simpan)} .k-DITOLAK{background:var(--tolak-bg);color:var(--tolak)}
.p-buy{background:var(--pos-soft);color:var(--pos)} .p-hold{background:var(--simpan-bg);color:var(--simpan)} .p-exit{background:var(--neg-soft);color:var(--neg)} .p-near{background:var(--violet-soft);color:#c4b5fd} .p-mute{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
svg .grid line{stroke:var(--line)}
.chartbox{width:100%;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.84rem;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=search],select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
select{max-width:100%}

/* jadual boleh-susun (dikongsi semua tab) */
.topscroll{overflow-x:auto;overflow-y:hidden;height:12px;margin-bottom:4px;border-radius:6px;background:var(--sunk)}
.topscroll>div{height:1px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0;user-select:none}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--fg-2)}
th.l,td.l{text-align:left}
td{font-variant-numeric:tabular-nums lining-nums;color:var(--fg-2)}
th[data-k] span::after{content:" ↕";opacity:.3}
th[aria-sort="descending"] span::after{content:" ↓";opacity:1;color:var(--accent)}
th[aria-sort="ascending"] span::after{content:" ↑";opacity:1;color:var(--accent)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 92%,#fff 1.5%)}
tbody tr:nth-child(even) td.frz{background:color-mix(in srgb,var(--surface) 92%,#fff 1.5%)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
tbody tr.click{cursor:pointer}
tbody tr.exit td{background:var(--neg-soft);color:#fecaca}
tbody tr.exit td.frz,tbody tr.exit:nth-child(even) td.frz{background:color-mix(in srgb,var(--neg) 14%,var(--surface))}
tbody tr.exit:nth-child(even) td{background:var(--neg-soft)}
tbody tr.exit td:first-child{box-shadow:inset 3px 0 0 var(--neg)}
tbody tr.exit:hover td{background:color-mix(in srgb,var(--neg) 20%,var(--surface))}
tbody tr.void td{opacity:.5}
tbody tr.void td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
td.name{text-align:left;white-space:normal;min-width:200px;max-width:320px}
td.name b{font-weight:700;color:var(--fg);margin-right:6px}
td .vv{display:block;color:var(--muted);font-size:.76rem;line-height:1.3;white-space:nowrap}
td.name .vv,td.wrap .vv{white-space:normal}
td.wrap{white-space:normal;min-width:220px;max-width:380px;text-align:left}
td.wrap.lrg{min-width:150px;max-width:210px}
td.tk b{color:var(--fg);font-weight:700}
.frz{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
th.frz{z-index:3;background:var(--sunk)}
.rkn{display:inline-block;min-width:1.7em;color:var(--muted);font-size:.78rem}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line-2)}.dots i.y{background:var(--pos)}.dots i.n{background:var(--neg)}
.pg{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.78rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pg-GUNA{background:rgba(234,179,8,.16);color:#facc15}.pg-UJI{background:rgba(203,213,225,.13);color:#e2e8f0}.pg-SIMPAN{background:rgba(217,119,6,.16);color:#f59e0b}.pg-x{background:var(--neg-soft);color:var(--neg)}
.corong{display:grid;gap:6px}.crg-h{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.crg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 92px;gap:10px;align-items:center;font-size:.88rem;border:0;background:none;color:var(--fg-2);text-align:left;padding:3px 4px;border-radius:6px;cursor:pointer;font-family:inherit}
.crg:hover{background:var(--sunk)}.crg[aria-pressed="true"]{background:var(--accent-soft)}.crg .t{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}.crg .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--violet))}
.crg .nm{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.crg .nm b{color:var(--fg);font-size:1rem}.crg .nm span{color:var(--neg);font-size:.76rem;margin-left:4px}
.crg.akhir .t i{background:var(--pos)}
@media (max-width:620px){.crg{grid-template-columns:1fr 64px}.crg .t{grid-column:1/3;grid-row:2}}
@media (max-width:760px){table[data-st="keputusan"] tbody td{flex-wrap:wrap;row-gap:0}table[data-st="keputusan"] tbody td>.vv{flex-basis:100%;text-align:right}table[data-st="keputusan"] tbody td.name>.vv{text-align:left}}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:5px;cursor:pointer;text-align:left;color:var(--fg-2);font:inherit}
.pod:hover{border-color:var(--line-2)}.pod .nmk{font-size:1.15rem;font-weight:700;color:var(--fg)}.pod .ln{font-size:.86rem}.pod .ln b{color:var(--fg)}
.kad{display:grid;gap:4px;margin:10px 0}.kad div{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:.88rem;align-items:baseline}.kad .y{color:var(--pos);font-weight:700}.kad .n{color:var(--neg);font-weight:700}.kad .q{color:var(--muted)}
.tablefoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-top:8px}
.more{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.85rem}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 48px;gap:8px;align-items:center;font-size:.86rem}
.bar .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px}
.strip{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--fg-2)}
.strip b.t{color:var(--warn);letter-spacing:.06em;font-size:.74rem;text-transform:uppercase}
.strip.next b.t{color:var(--accent)}
.strip span{flex:1 1 300px;min-width:0}
.ph{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px 18px;color:var(--muted);background:var(--sunk)}
.ph h3{color:var(--fg-2);margin-bottom:6px}
.ph ul{margin:8px 0 0;padding-left:18px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:8px}

/* Prestasi */
.grid2.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.grid2.eq{grid-template-columns:1fr}}
.chartbox.scrolly{max-height:520px;overflow-y:auto}
svg .hit{cursor:pointer}
svg .hit:hover path,svg .hit:hover circle,svg .hit:hover rect:not([fill=transparent]){filter:brightness(1.25)}
.panel.danger{border-color:color-mix(in srgb,var(--neg) 35%,var(--line));background:linear-gradient(180deg,rgba(239,68,68,.05),transparent 120px),var(--card)}
.panel.danger h2::before{background:var(--neg)}
.worstgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.worst{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.wrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.86rem;flex-wrap:wrap}
.wrow:last-child{border-bottom:0}
.wrow b{color:var(--fg)}
.wsub{font-size:.76rem}
.skbar{display:inline-flex;align-items:center;gap:6px}
.skbar>span{width:52px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block}
.skbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--accent))}

/* helaian butiran */
.scrim{position:fixed;inset:0;background:rgba(2,6,15,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;border-top:1px solid var(--line-2);padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:780px;margin:0 auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
.sheet h3{font-size:1.25rem;font-weight:700;text-wrap:balance}
.close{float:right;border:0;background:var(--sunk);color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.gates{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.gate{font-size:.8rem;padding:4px 8px;border-radius:6px}
.gate.ok{color:var(--guna);background:var(--guna-bg)} .gate.no{color:var(--tolak);background:var(--tolak-bg)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px;margin:12px 0}

<script>

const S={set:'431',tab:'backtest',sub:{backtest:'keputusan',prestasi:'m'},docs:{},meta:null,live:false,
  f:{jenis:'semua',kep:new Set(),q:'',best:true,gaya:false,shown:40},cmp:[],cmpTouched:false,
  ptm:null,ptmPeta:null,ptc:null,ptcN:{},mae:null,prf:null,watch:null,beli:null,sektor:null,hst:null,sf:null,wf:{k:'',sk:'',ind:'',q:'',shown:60},kat:null,kf:{q:''},at:{},af:{lbl:'',q:'',eq:'oos',v:'sar',lane:''},kp:{lihat:'pingat',gaya:false,q:'',langkah:null},b4:'papan'};
try{const t=localStorage.getItem('pbs2_tab');if(MAIN.includes(t))S.tab=t;const s=localStorage.getItem('pbs_set');if(SETSEG.includes(s))S.set=s;const b4=localStorage.getItem('pbs2_b4');if(['papan','ringkasan','banding'].includes(b4))S.b4=b4;
  const sb=JSON.parse(localStorage.getItem('pbs2_sub')||'null');if(sb){if(SUBS.backtest.some(x=>x[0]===sb.backtest))S.sub.backtest=sb.backtest;if(SUBS.prestasi.some(x=>x[0]===sb.prestasi))S.sub.prestasi=sb.prestasi;}}catch(e){}
{const h=(location.hash||'').slice(1);const map={keputusan:['backtest','keputusan'],ringkasan:['backtest','keputusan'],kedudukan:['backtest','keputusan'],butiran:['backtest','butiran'],papan:['backtest','butiran'],banding:['backtest','butiran'],sektor:['sektor'],watchlist:['watch'],ptm:['ptm'],ptc:['ptc'],prestasi:['prestasi'],kaedah:['kaedah'],autotune:['backtest','butiran']};if(map[h]){S.tab=map[h][0];if(map[h][1])S.sub.backtest=map[h][1];if(h==='autotune')S.set='2000';if((h==='papan'||h==='banding')&&S.set==='2000')S.set='431';if(h==='banding')S.b4='banding';if(h==='papan')S.b4='papan';}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(x,d=1)=>x==null||isNaN(x)?'–':(x*100).toFixed(d)+'%';
const sgn=(x,d=1)=>x==null||isNaN(x)?'–':((x>0?'+':'')+(x*100).toFixed(d)+'%');

const fx=(x,d=1)=>x==null||isNaN(x)?'–':Number(x).toFixed(d);
const cls=v=>v==null||isNaN(v)?'':v>0?'pos':v<0?'neg':'';

const jumlahDari=c=>c==null||isNaN(c)?null:Math.pow(1+c,TEMPOH)-1;
const avgOf=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};

/* memo: kira semula hanya bila objek sumber berubah (data langsung menggantikan objek dokumen) */
const memo=fn=>{let k=null,v;return (...d)=>{if(k&&d.length===k.length&&d.every((x,i)=>x===k[i]))return v;k=d;v=fn(...d);return v;};};
/* satu render bagi setiap bingkai walaupun banyak dokumen tiba serentak */
let tmR=0;const renderSoon=()=>{if(!tmR)tmR=setTimeout(()=>{tmR=0;renderAll();},30);};
function allRows(){const out=[];for(const d of Object.values(S.docs)){for(const r of (d.rows||[]))out.push(r);}return out;}
function rowsForSet(set){return allRows().filter(r=>r.set===set);}
function bench(set){const m=S.meta||{};return{ew:m.ew?.[set],spy:m.spy?.[set],qqq:m.qqq?.[set],ewmdd:m.ew_mdd?.[set]};}
function bestBy(rows,k){const by={};for(const r of rows){const b=by[r.id];if(!b||(r[k]??-1e9)>(b[k]??-1e9))by[r.id]=r;}return Object.values(by);}
function bestPerMethod(rows){const by={};for(const r of rows){const b=by[r.id];
  if(!b)by[r.id]=r;else{const rs=r.skor??-1,bs=b.skor??-1;if(rs>bs||(rs===bs&&(r.cagr??-9)>(b.cagr??-9)))by[r.id]=r;}}return Object.values(by);}

/* ================= komponen jadual boleh-susun (dikongsi) =================
   col: {k, t, tip, v(r)=nilai susun, f(r,i)=html sel, l=kiri, frz, ns=tak boleh susun, c(r)=kelas sel} */
const SORT={},ST_R={};
function isNil(x){return x==null||x===''||(typeof x==='number'&&isNaN(x));}
function sortRows(rows,cols,st){const c=cols.find(c=>c.k===st.k);if(!c)return rows;const g=c.v||(r=>r[c.k]);
  return [...rows].sort((a,b)=>{const x=g(a),y=g(b),xn=isNil(x),yn=isNil(y);if(xn&&yn)return 0;if(xn)return 1;if(yn)return -1;
    if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y),undefined,{numeric:true})*st.dir;return (x-y)*st.dir;});}
function sortTable(o){
  const st=SORT[o.id]||(SORT[o.id]={k:o.def?o.def.k:null,dir:o.def?o.def.dir:-1});
  ST_R[o.id]=o.rerender||renderAll;
  let rows=st.k?sortRows(o.rows,o.cols,st):[...o.rows];const total=rows.length;
  if(o.limit)rows=rows.slice(0,o.limit);
  const th=o.cols.map(c=>`<th class="${c.l?'l':''} ${c.frz?'frz':''}"${c.ns?'':` data-k="${c.k}" data-d="${c.l?'asc':'desc'}" aria-sort="${st.k===c.k?(st.dir<0?'descending':'ascending'):'none'}"`}${c.tip?` data-tip="${c.tip}"`:''}><span>${c.t}</span></th>`).join('');
  const tb=rows.map((r,i)=>`<tr${o.attr?' '+o.attr(r):''} class="${o.rcls?o.rcls(r):''}">${o.cols.map(c=>`<td class="${c.l?'l':''} ${c.frz?'frz':''} ${c.c?c.c(r):''}">${c.f?c.f(r,i):esc(isNil(r[c.k])?'–':r[c.k])}</td>`).join('')}</tr>`).join('');
  const grd=o.cols.some(c=>c.c&&/\bgrd\b/.test(c.c({})||''));
  return `<div class="tablewrap${grd?' tw-grd':''}"><table data-st="${o.id}"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>${total?'':`<p class="empty">${o.empty||'Tiada data.'}</p>`}</div>`+(o.foot?o.foot(Math.min(total,rows.length),total):'');
}
document.addEventListener('click',e=>{const th=e.target.closest&&e.target.closest('table[data-st] th[data-k]');if(!th)return;
  const id=th.closest('table').dataset.st;const st=SORT[id];if(!st)return;const k=th.dataset.k;
  if(st.k===k)st.dir*=-1;else{st.k=k;st.dir=th.dataset.d==='asc'?1:-1;}(ST_R[id]||renderAll)();});

/* ================= navigasi ================= */

/* Kemas kini terakhir (harian/status): masa data dashboard terakhir ditolak (dikemaskini; sebelum peralihan:

   merah jika lebih 30 jam (Ahad–Selasa MYT: 74 jam, merentas hujung minggu). */
function renderData(){const mEl=$('#kiniMasa'),dEl=$('#kiniData');if(!mEl)return;const h=S.hst;
  if(!h){mEl.textContent='–';mEl.className='';dEl.textContent='';return;}
  const t=h.dikemaskini||h.kemaskini_pagi||'';const m=/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(t);
  const kp=m?Date.UTC(+m[1],m[2]-1,+m[3],+m[4]-8,+m[5]):null;
  const hari=new Date(Date.now()+8*3600e3).getUTCDay();const had=(hari<=2?74:30)*3600e3;
  const basi=!kp||(Date.now()-kp>had);
  mEl.textContent=t||'–';mEl.className=basi?'neg':'';
  dEl.innerHTML=`data tutup <b style="font-size:inherit;font-weight:600;color:var(--fg-2)">${esc(h.harga_tutup_pada||h.tarikh_data_pagi||'–')}</b>${basi?' <span class="pill p-exit">belum dikemas kini</span>':''}`;}

/* ================= Backtest · Keputusan =================
   Satu jawapan bagi setiap kaedah M: 7 langkah saringan (bahasa mudah), pingat ikut keputusan enjin bagi yang lulus semua.
   Langkah 1–5 = gate enjin v1.2 set 431 (G2, G3, G4, G1, G5); 6 = varian sama untung (CAGR > 0) dalam S1–S4;
   7 = Ujian 2 (autotune/a02_saringan, PARAM asal, 2013–2018): CAGR > 0 dalam kumpulan A dan B (lorong terbaik).
   Varian dipapar = yang lulus paling banyak langkah, kemudian skor enjin, kemudian CAGR. */
const LANGKAH=[
  {k:'n',p:1,t:'Cukup dagangan',d:'Sekurang-kurangnya 100 dagangan (2019–2026), supaya keputusan bukan kebetulan.'},
  {k:'pasaran',p:1,t:'Untung lebih daripada SPY',d:'Untung setahun (CAGR) melebihi SPY dalam tempoh yang sama.'},
  {k:'jatuh',p:1,t:'Jatuh tidak lebih 45%',d:'Nilai portfolio tidak pernah jatuh lebih 45% dari puncak (MDD).'},
  {k:'rugi',p:1,t:'Rugi setiap dagangan kecil',d:'Ada henti rugi dan purata rugi dagangan kalah tidak lebih teruk daripada −12%.'},
  {k:'masa',p:1,t:'Untung 2019–22 dan 2023–26',d:'Untung dalam kedua-dua separuh tempoh, bukan bergantung pada satu zaman pasaran.'},
  {k:'saham',p:2,t:'Untung dalam S1, S2, S3 dan S4',d:'Varian yang sama masih untung dalam empat kumpulan kecil (≈108 saham setiap satu).'},
  {k:'u2',p:3,t:'Masih untung dalam Ujian 2',d:'Atas 2000 saham AS lain, 2013–2018, parameter asal: untung dalam kumpulan saham A dan B.'}];
const PERINGKAT={1:'Ujian 1 · 431 saham Shariah · Nov 2019 – Okt 2026',2:'Kumpulan saham lain · S1–S4 daripada 431',3:'Ujian 2 · 2000 saham AS lain · 2013–2018'};
const PINGAT={'GUNA':['🥇','Emas','pg-GUNA'],'UJI KERTAS':['🥈','Perak','pg-UJI'],'SIMPAN':['🥉','Gangsa','pg-SIMPAN']};
const PG_ORD={'GUNA':0,'UJI KERTAS':1,'SIMPAN':2};
const rm=v=>v==null||!isFinite(v)?'–':'RM'+(Math.round(v/100)*100).toLocaleString('en-US');
const kpM=memo((docs,at,meta)=>{
  const sar=(at||{}).a02_saringan,u2={};
  (sar&&sar.baris||[]).forEach(r=>{const c=atMin(r.cA,r.cB),o=u2[r.k];if(c!=null&&(!o||c>o.c))u2[r.k]={c,cA:r.cA,cB:r.cB,l:r.l,w:atMin(r.wA,r.wB),m:atMin(r.mA,r.mB),spy:sar.spy};});
  const sm={};allRows().forEach(r=>{if(/^S\d$/.test(r.set))sm[r.set+'|'+r.id+'|'+r.varian]=r;});
  const spy=bench('431').spy,by={},sk=x=>[x.lulus,x.r.skor??-1,x.r.cagr??-9];
  rowsForSet('431').forEach(r=>{if(r.id[0]!=='M')return;
    const g=new Set((r.gate_gagal||'').split(/\s+/).filter(Boolean)),sc=['S1','S2','S3','S4'].map(x=>{const y=sm[x+'|'+r.id+'|'+r.varian];return y?y.cagr:null;}),v2=u2[r.id]||null;
    const c={n:!g.has('G2'),pasaran:!g.has('G3'),jatuh:!g.has('G4'),rugi:!g.has('G1'),masa:!g.has('G5'),
      saham:sc.some(x=>x==null)?null:sc.every(x=>x>0),u2:!sar||!v2?null:v2.c>0};
    const o={r,id:r.id,nama:r.kaedah,dk:key(r),c,sc,v2,spy,lulus:LANGKAH.filter(L=>c[L.k]===true).length,gagal:LANGKAH.findIndex(L=>c[L.k]!==true)};
    const b=by[r.id];if(!b)by[r.id]=o;else{const x=sk(o),y=sk(b);for(let i=0;i<3;i++){if(x[i]!==y[i]){if(x[i]>y[i])by[r.id]=o;break;}}}});

function drawScatter(box,rows,b){
  const W=Math.max(300,box.clientWidth||600),H=Math.round(Math.min(360,W*0.62));
  const P={l:44,r:12,t:12,b:30};const pts=rows.filter(r=>r.cagr!=null&&r.mdd!=null);
  const xmin=Math.min(-0.8,...pts.map(r=>r.mdd)),xmax=0;
  let ymin=Math.min(-0.1,...pts.map(r=>r.cagr)),ymax=Math.max(0.3,...pts.map(r=>r.cagr));
  ymin=Math.floor(ymin*10)/10;ymax=Math.ceil(ymax*10)/10;const x0=Math.floor(xmin*10)/10;
  const X=v=>P.l+(v-x0)/(xmax-x0)*(W-P.l-P.r),Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
  let g='<g class="grid">';const yt=[],xt=[];
  for(let v=ymin;v<=ymax+1e-9;v+=0.1)yt.push(+v.toFixed(2));for(let v=x0;v<=0.0001;v+=0.1)xt.push(+v.toFixed(2));
  const ys=yt.length>9?yt.filter((_,i)=>i%2===0):yt, xs=xt.length>6?xt.filter((_,i)=>i%2===0):xt;

function drawPegang(box,series){

  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Profil pegangan">${g}${ref}${ln}${t}</svg>`;

const SKP={1:['prestasi_1d','1H',3],w:['prestasi_1w','1W',5],m:['prestasi_1m','1M',10],q:['prestasi_3m','3M',20]};
const FASA={Leading:{c:'--pos',bm:'Memimpin'},Improving:{c:'--accent',bm:'Membaik'},Weakening:{c:'--warn',bm:'Melemah'},Lagging:{c:'--neg',bm:'Ketinggalan'}};
const fasaPill=f=>f?`<span class="pill" style="background:color-mix(in srgb,var(${FASA[f].c}) 16%,transparent);color:var(${FASA[f].c})">${f}</span>`:'<span class="mut">–</span>';
function heatCol(v,lim){if(v==null||isNaN(v))return 'var(--sunk)';const t=Math.max(-1,Math.min(1,v/lim));const a=(0.18+0.72*Math.abs(t)).toFixed(2);

function squarify(items,x,y,w,h){const out=[];let rest=items.filter(d=>d.v>0).sort((a,b)=>b.v-a.v);const tot=rest.reduce((s,d)=>s+d.v,0);if(!tot)return out;
  const sc=w*h/tot;rest=rest.map(d=>Object.assign({},d,{a:d.v*sc}));
  const worst=(row,len)=>{const s=row.reduce((t,d)=>t+d.a,0),mx=Math.max(...row.map(d=>d.a)),mn=Math.min(...row.map(d=>d.a));return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){const len=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length&&worst(row.concat(rest[i]),len)<=worst(row,len)){row.push(rest[i]);i++;}
    rest=rest.slice(i);const s=row.reduce((t,d)=>t+d.a,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(d=>{const ch=d.a/cw;out.push(Object.assign(d,{x,y:cy,w:cw,h:ch}));cy+=ch;});x+=cw;w-=cw;}
    else{const ch=s/w;let cx=x;row.forEach(d=>{const cw=d.a/ch;out.push(Object.assign(d,{x:cx,y,w:cw,h:ch}));cx+=cw;});y+=ch;h-=ch;}}

function drawRotasi(box,rows){

  if(!pts.length){box.innerHTML='<p class="empty">Tiada data.</p>';return;}

  const X=v=>P.l+(v+mx)/(2*mx)*(W-P.l-P.r),Y=v=>P.t+(my-v)/(2*my)*(H-P.t-P.b);
  const q=(x0,y0,x1,y1,f,lx,ly,anc)=>`<rect x="${X(x0)}" y="${Y(y1)}" width="${X(x1)-X(x0)}" height="${Y(y0)-Y(y1)}" fill="var(${FASA[f].c})" opacity=".06"/><text x="${lx}" y="${ly}" text-anchor="${anc}" style="fill:var(${FASA[f].c});font-weight:700;font-size:11px;letter-spacing:.06em">${f.toUpperCase()} · ${FASA[f].bm}</text>`;
  let g=q(0,0,mx,my,'Leading',W-P.r-4,P.t+12,'end')+q(-mx,0,0,my,'Improving',P.l+4,P.t+12,'start')+q(0,-my,mx,0,'Weakening',W-P.r-4,H-P.b-6,'end')+q(-mx,-my,0,0,'Lagging',P.l+4,H-P.b-6,'start');
  g+=`<line x1="${X(0)}" x2="${X(0)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--line-2)"/><line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)"/>`;
  g+=`<text x="${W-P.r}" y="${H-8}" text-anchor="end">Kekuatan 3M lawan pasaran (mata %) →</text><text x="${P.l}" y="${H-8}">←</text><text x="${P.l-4}" y="${Y(0)+4}" text-anchor="end">0</text>`;
  g+=`<text transform="translate(12,${(P.t+H-P.b)/2}) rotate(-90)" text-anchor="middle">Momentum 1M lawan pasaran ↑</text>`;

3M lawan pasaran ${r.rel_3m>0?'+':''}${fx(r.rel_3m,1)} · 1M lawan pasaran ${r.rel_1m>0?'+':''}${fx(r.rel_1m,1)}</title></circle>`;
    if(!many||lab1m.has(r.nama))g+=`<text x="${(X(r.rel_3m)+rad+3).toFixed(1)}" y="${(Y(r.rel_1m)+4).toFixed(1)}" style="fill:var(--fg-2);font-size:11px">${esc(r.nama.length>22?r.nama.slice(0,21)+'…':r.nama)}</text>`;});

/* ================= lajur papertrade diselaraskan (M, C, Prestasi) ================= */
function hariDari(t){if(!t)return null;const d=Date.parse(t+'T00:00:00Z');if(isNaN(d))return null;let n=0;const now=new Date();for(let x=new Date(d);x<now;x.setUTCDate(x.getUTCDate()+1)){const w=x.getUTCDay();if(w&&w<6)n++;}return Math.max(0,n-1);}
function normPT(r){const keluar=!!(r.keluar||r.tarikh_keluar);const kk=r.kaedah_kongsi;return Object.assign({},r,{
  kaedah_kongsi:Array.isArray(kk)?kk:typeof kk==='string'&&kk.trim()?kk.split(/[,;]\s*/).filter(Boolean):null,
  kaedah:r.kaedah||r.id_kaedah||'–',hari:r.tidak_dibeli?null:(r.hari??hariDari(r.tarikh_beli)),keluar,
  isyarat_keluar:r.isyarat_keluar||(keluar?'Keluar':'Pegang'),
  untung_akhir_pct:keluar?(r.untung_akhir_pct??r.untung_pct):null,
  harga_terkini:keluar&&r.harga_keluar!=null?r.harga_keluar:r.harga_terkini,tidak_sah:!!r.tidak_sah,
  keluar_henti:benar(r.keluar_henti),
  /* tutup sepenuhnya hanya apabila kedua-dua lorong keluar; tanpa data lorong 2 (baris lama) ikut lorong kaedah */
  tutup_semua:r.tutup_semua!=null&&r.tutup_semua!==''?benar(r.tutup_semua):(r.status_henti||r.keluar_henti!=null&&r.keluar_henti!=='')?keluar&&benar(r.keluar_henti):keluar,
  untung_henti_pct:nomb(r.untung_henti_pct),harga_keluar_henti:nomb(r.harga_keluar_henti)});}
/* dua lorong keluar (sejak 17 Okt 2026): 1 kaedah, 2 pegang selagi naik (standard/keluar_lorong.py) */
const LORONG={kaedah:['keluar','tarikh_keluar','harga_keluar','untung_akhir_pct','isyarat_keluar'],henti:['keluar_henti','tarikh_keluar_henti','harga_keluar_henti','untung_henti_pct','status_henti']};
/* untung lorong: akhir jika lorong itu sudah keluar, semasa jika masih dipegang */
const hasilL=(r,l)=>r[LORONG[l][0]]?r[LORONG[l][3]]:r.untung_pct;

function hariAntara(a,b){const x=Date.parse((a||'')+'T00:00:00Z'),y=Date.parse((b||'')+'T00:00:00Z');if(isNaN(x)||isNaN(y)||y<x)return null;let n=0;for(let d=new Date(x+864e5);d<=y;d.setUTCDate(d.getUTCDate()+1)){const w=d.getUTCDay();if(w&&w<6)n++;}return n;}
const tkO=t=>/^\d{4}-\d\d-\d\d/.test(t||'')?(+t.slice(8,10))+' '+BLN[+t.slice(5,7)-1]:'';
/* satu sel bagi setiap lorong, format seragam: status · tarikh @ harga · untung · sebab */
function selLorong(r,l){const [k,t,h,u,st]=LORONG[l];if(r.tidak_dibeli)return '<span class="mut">–</span>';

  if(r[k]){const hr=hariAntara(r.tarikh_beli,r[t]),sb=(r[st]||'').replace(/^Keluar:? ?/,'').replace(/ \([^)]*\)\s*$/,'');
    return kotak('p-exit','Keluar',`${pct(r[u])}<span class="vv nw">${esc(tkO(r[t]))} @ ${fx(r[h],2)}${hr!=null?' · '+hr+' hari':''}</span>${sb?`<span class="vv">${esc(sb)}</span>`:''}`);}
  if(!r[st])return kotak('p-mute','Belum',`${pct(r.untung_pct)}<span class="vv">belum dinilai</span>`);

function grPem(r){if(GORD[r.gred_pemangkin]==null)return `<span class="mut">${r.pemangkin&&r.pemangkin!=='belum dikumpul'?esc(r.pemangkin):'Belum dikumpul'}</span>`;

const katGabungM=memo((rows,docs,src)=>{const bt={};for(const d of Object.values(docs))for(const x of (d.rows||[]))if(x.set==='431')bt[x.id+'|'+x.varian]=x;

function selBt(r){const b=r.bt;if(!b)return `<span class="mut">${S.live&&Object.keys(S.docs).length?'Tiada dalam registry':'Memuatkan…'}</span>`;

function selPt(r){const o=r.pt;if(!o)return `<span class="mut">${ptcRows()||ptmRows()?'Belum ada dagangan':'Memuatkan…'}</span>`;
  return `${kptPill(o.kep)}<span class="vv"><b class="${cls(o.avg)}">Untung purata ${sg2(o.avg)}</b></span><span class="vv">Menang ${fx(o.win,0)}% · terburuk <span class="${cls(o.worst)}">${sg2(o.worst)}</span></span><span class="vv">${o.n} dagangan (${o.ex} keluar)${o.nM?' · M '+o.nM:''}${o.nC?' · C '+o.nC:''}</span>`;}

   Hanya kaedah_<ID> yang tersenarai dalam ringkasan.kaedah_doc dan sama `dibina` dipapar (dokumen lama diabaikan). */
const AT_LBL=['TINGGI','SEDERHANA','RENDAH','GAGAL','BUKAN SWING','PANDANG HADAPAN','BELUM DITALA'];
const AT_CLS={'MENANG':'k-GUNA','HAMPIR':'k-UJI','TIDAK':'k-DITOLAK','LULUS':'k-GUNA','CALON':'k-UJI','TIDAK LULUS':'k-DITOLAK','TINGGI':'k-GUNA','SEDERHANA':'k-UJI','RENDAH':'k-SIMPAN','GAGAL':'k-DITOLAK','BUKAN SWING':'p-near','PANDANG HADAPAN':'k-DITOLAK','BELUM DITALA':''};

const AT_KAVEAT='Had atas: data tanpa saham delist (yfinance); hasil backtest, bukan jaminan.';
const atPill=l=>`<span class="pill ${AT_CLS[l]||''}"${AT_CLS[l]?'':' style="background:var(--sunk);color:var(--muted)"'}>${esc(l||'–')}</span>`;
const atV=v=>typeof v==='number'&&!Number.isInteger(v)?String(+v.toPrecision(4)):String(v);
const atParam=p=>p&&Object.keys(p).length?Object.entries(p).map(([k,v])=>`${esc(k)}=${esc(atV(v))}`).join(', '):'PARAM asal';
const atJul=x=>Array.isArray(x)&&x[0]?`${esc(x[0])} – ${esc(x[1]||'')}`:'–';
const atMdd=v=>`<span class="${v!=null&&v<-0.3?'neg':''}">${pct(v)}</span>`;
function atKaedah(){const D=S.at||{},rg=D.ringkasan;if(!rg)return [];const ids=new Set(rg.kaedah_doc||[]);
  return Object.entries(D).filter(([id,d])=>ids.has(id)&&d&&d.dibina===rg.dibina).map(([,d])=>d);}
function atSiri(gb){const e=gb.ekuiti_bulanan||{};return S.af.eq==='kunci'
  ?[{nama:'Gabungan · kunci',col:'--accent',pts:e.kunci||[]},{nama:'SPY',col:'--ref',dash:1,pts:e.spy_kunci||[]}]
  :[{nama:'Gabungan · OOS-A',col:'--accent',pts:e.A||[]},{nama:'Gabungan · OOS-B',col:'--violet',pts:e.B||[]},{nama:'SPY',col:'--ref',dash:1,pts:e.spy_A||[]}];}
function drawAtEq(box,series){
  if(!box)return;const W=Math.max(280,box.clientWidth||520),H=220,P={l:46,r:12,t:12,b:24};
  const bln=[...new Set(series.flatMap(s=>s.pts.map(p=>p[0])))].sort();
  const vals=series.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>v!=null&&v>0&&isFinite(v));
  if(bln.length<2||!vals.length){box.innerHTML='<p class="empty">Tiada data ekuiti bulanan.</p>';return;}
  const lo=Math.min(1,...vals),hi=Math.max(1,...vals),lg=hi/lo>3,tr=v=>lg?Math.log(v):v,iv=v=>lg?Math.exp(v):v;
  const a=tr(lo),b=tr(hi),pad=(b-a)*.05||.05,ymin=a-pad,ymax=b+pad;const ix={};bln.forEach((m,i)=>ix[m]=i);
  const X=i=>P.l+i/(bln.length-1)*(W-P.l-P.r),Y=v=>P.t+(ymax-tr(v))/(ymax-ymin)*(H-P.t-P.b);
  let g='<g class="grid">',t='';for(let k=0;k<=4;k++){const v=iv(ymin+(ymax-ymin)*k/4),y=Y(v).toFixed(1);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/>`;t+=`<text x="${P.l-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${v.toFixed(v<10?2:1)}×</text>`;}g+='</g>';
  const thn=bln.filter((m,i)=>i===0||m.endsWith('-01')),lgk=Math.max(1,Math.ceil(thn.length/Math.max(2,Math.floor((W-P.l-P.r)/56))));
  thn.forEach((m,j)=>{if(j%lgk)return;t+=`<text x="${X(ix[m]).toFixed(1)}" y="${H-6}" text-anchor="middle">${m.slice(0,4)}</text>`;});
  const ref=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(1).toFixed(1)}" y2="${Y(1).toFixed(1)}" stroke="var(--line-2)"/>`;
  let ln='';series.forEach(s=>{const pts=s.pts.filter(p=>p[1]>0&&ix[p[0]]!=null);if(!pts.length)return;
    ln+=`<polyline points="${pts.map(p=>X(ix[p[0]]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="var(${s.col})" stroke-width="${s.dash?1.6:2.2}"${s.dash?' stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    const L=pts[pts.length-1];ln+=`<circle cx="${X(ix[L[0]]).toFixed(1)}" cy="${Y(L[1]).toFixed(1)}" r="3" fill="var(${s.col})"><title>${esc(s.nama)} ${esc(L[0])}: ${L[1].toFixed(2)}×</title></circle>`;});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Ekuiti bulanan portfolio gabungan lawan SPY${lg?' (skala log)':''}">${g}${ref}${ln}${t}</svg>`;
}

  const m=gb.metrik||{},B=[['A','OOS-A','at_oosa'],['B','OOS-B','at_oosb'],['kunci','Tempoh kunci','at_kunci']],ps=gb.param_semasa||{};
  const kalah=B.filter(([b])=>!(m[b]&&m[b].cagr!=null&&m[b].spy!=null&&m[b].cagr>m[b].spy)).map(x=>x[1]);

    <div class="filters" style="margin-bottom:10px"><div class="seg" id="atLane">${[['','Semua'],['had60','had60'],['asal','asal']].map(([v,x])=>`<button type="button" data-v="${v}" aria-pressed="${af.lane===v}">${x}</button>`).join('')}</div><input type="search" id="atQ" placeholder="Cari ID atau nama kaedah" value="${esc(af.q)}" aria-label="Cari kaedah saringan"></div>

  const q=$('#atQ');let tm;q.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{af.q=q.value.trim();renderAll();const n=$('#atQ');n.focus();n.setSelectionRange(n.value.length,n.value.length);},220);};
  $('#atLane').onclick=e=>{const b=e.target.closest('button');if(!b)return;af.lane=b.dataset.v;renderAll();};

function renderAutotune(){
  const af=S.af;if(!AT_V.some(x=>x[0]===af.v))af.v='sar';
  if(af.v==='a01')renderAt01();else if(af.v==='sar')renderAtSar();else renderAtV(af.v);
  const el=$('#v-autotune');
  butiranSeg(el,AT_V,af.v,'atVer');
  el.querySelector('.bseg').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===af.v)return;af.v=b.dataset.v;af.lbl='';af.q='';af.lane='';renderAll();};
}

function emptyState(){return `<div class="panel empty">${S.live?'Belum ada keputusan backtest dalam pangkalan data.':'Memuatkan keputusan backtest…'}</div>`;}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800);}
function topScrolls(root){
  root.querySelectorAll('.tablewrap').forEach(w=>{
    const prev=w.previousElementSibling;if(prev&&prev.classList.contains('topscroll'))prev.remove();
    const hs=[...w.querySelectorAll('thead th')].map(h=>(h.textContent||'').replace(/[↕↓↑]/g,'').trim());
    w.querySelectorAll('tbody tr').forEach(tr=>{let c=0;[...tr.children].forEach(td=>{td.setAttribute('data-label',hs[c]||'');c+=td.colSpan||1;});});
  });
}
const R={keputusan:renderKeputusan,ringkasan:butiran431(renderRingkasan),papan:butiran431(renderPapan),banding:butiran431(renderBanding),sektor:renderSektor,watch:renderWatch,ptm:renderPtm,ptc:renderPtc,'pr-m':()=>renderPrestasi('m'),'pr-c':()=>renderPrestasi('c'),'pr-gab':()=>renderPrestasi('gab'),kaedah:renderKaedah,autotune:renderAutotune};
function renderAll(){const vid=viewId();const el=document.getElementById(vid);
  const sx={};el.querySelectorAll('table[data-st]').forEach(t=>{sx[t.dataset.st]=t.parentElement.scrollLeft;});
  try{R[vid.slice(2)]();}catch(err){el.innerHTML=`<div class="panel empty" style="text-align:left"><b class="neg">Ralat memapar tab ini.</b><br>${esc(err&&err.message||err)}<br><span class="mut">${esc(String(err&&err.stack||'').split('\n').slice(0,3).join(' | '))}</span></div>`;return;}
  applyFold(el);applyTips(el);
  requestAnimationFrame(()=>{topScrolls(el);el.querySelectorAll('table[data-st]').forEach(t=>{if(sx[t.dataset.st])t.parentElement.scrollLeft=sx[t.dataset.st];});});}
let rz,lw=window.innerWidth;window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-lw)<40)return;lw=window.innerWidth;clearTimeout(rz);rz=setTimeout(renderAll,200);});

  kp_jatuh:{t:'Jatuh terburuk',d:'Kejatuhan paling dalam nilai portfolio dari puncak ke lembah dalam Ujian 1 (MDD). Merah jika lebih teruk daripada −45%.',e:'−37%: RM10,000 pernah turun ke RM6,300 sebelum naik semula.'},
  kp_menang:{t:'Menang',d:'Berapa dagangan daripada 10 yang ditutup dengan untung (Ujian 1). Cara jual-cepat-bila-rugi biasanya 3–4 daripada 10; untung datang daripada beberapa dagangan besar.',e:'4/10 = 4 untung, 6 rugi kecil.'},
  kp_pegang:{t:'Pegang',d:'Purata hari dagangan setiap posisi dipegang, dan purata bilangan dagangan setahun bagi semua saham dalam set (Ujian 1).',e:'34 hari ≈ 1.5 bulan.'},

  at_skor_sar:{t:'Lebihan min',d:'Skor saringan = nilai lebih kecil antara (CAGR A − SPY) dan (CAGR B − SPY), 2013–2018. Positif = mengatasi SPY dalam kedua-dua kumpulan saham.',e:'−2.5% = sekurang-kurangnya satu kumpulan ketinggalan 2.5% setahun berbanding SPY.'},
  at_dag:{t:'Dagangan portfolio',d:'Bilangan dagangan yang benar-benar dibeli oleh portfolio (8 slot × 12.5%, atau 5 × 20% bagi A03) dalam tempoh ujian, bagi kumpulan saham itu; hari = purata hari pegang.',e:'440 dagangan dalam 6 tahun ≈ 1–2 dagangan seminggu.'},
  at_lorong:{t:'Lorong',d:'had60: enjin menutup dagangan selepas 60 hari pegang. asal: tiada had enjin; keluar ikut peraturan asal kaedah (TMAX asal).',e:'M82 had60 = kaedah M82 dengan had pegang 60 hari.'},
  at_lulus:{t:'Label A02',d:'LULUS: pulangan berlebihan atas SPY > 0 pada OOS A dan B, lebihan pengesahan 2019 – kini > 0, MDD OOS ≥ MDD SPY − 10 mata peratus, DSR ≥ 0.90 dan imbasan pandang ke hadapan bersih. CALON: tiga syarat pertama sahaja. TIDAK LULUS: selain itu.',e:'Lebihan A +3.5% tetapi pengesahan −0.6% = TIDAK LULUS.'},
  at_menang_lbl:{t:'Label MENANG (A03)',d:'MENANG: kadar menang ≥ 55% pada OOS A dan B (2013–2018), CAGR > 0 dan PF ≥ 1.3 pada A dan B, MDD OOS ≥ −35%, pengesahan 2019 – kini menang ≥ 55% dan CAGR > 0, ≥ 100 dagangan, imbasan bersih. HAMPIR: semua kecuali satu syarat. TIDAK: selain itu.',e:'Baris kecil "gagal" dalam jadual menyenaraikan syarat yang tidak dipenuhi.'},

  at_label:{t:'Label AUTOTUNE',d:'TINGGI: CAGR OOS-A dan OOS-B > SPY, MDD OOS-A ≥ −30%, CAGR tempoh kunci > SPY, DSR ≥ 0.95 dan PBO ≤ 0.30. SEDERHANA: tiga syarat pertama sahaja. RENDAH: CAGR OOS-A > 0. GAGAL: selain itu. BUKAN SWING: purata pegang OOS-A < 2 atau > 60 hari. PANDANG HADAPAN: imbasan potong-data mendapati kod memakai data hari esok; dikecualikan. BELUM DITALA: modul gagal kesetaraan atau kajian tidak lengkap.',e:'Hanya TINGGI dan SEDERHANA menjadi calon portfolio gabungan.'},
  at_oosa:{t:'OOS-A',d:'Gabungan 12 tetingkap ujian walk-forward (2013 – Sep 2024). Setiap tetingkap memakai parameter yang ditala atas 3 tahun sebelumnya, saham kumpulan A (kumpulan tala). SPY = tempoh yang sama.',e:'CAGR OOS-A 15% lawan SPY 12% = mengatasi SPY.'},

  kaedah:{t:'Kaedah / varian',d:'Kod dan nama kaedah. M = kaedah dagangan lengkap (masuk, henti rugi, keluar). I = satu indikator sahaja, keluar apabila harga tutup di bawah SMA20. Baris kecil ialah varian, iaitu variasi tetapan bagi kaedah yang sama.',e:'"M96 · V1 Dikunci (+henti tutup−3×ATR14)" = kaedah M96, varian V1 dengan henti rugi 3×ATR di bawah harga tutup.'},

  untung_akhir:{t:'Untung akhir %',d:'Untung dibekukan pada harga keluar. Kosong bagi posisi yang masih dipegang.',e:''},
  win_p:{t:'Kadar menang (papertrade)',d:'Peratus posisi yang untung (untung akhir bagi yang keluar, semasa bagi yang dipegang).',e:'3/5 = 60%.'},
  pct_dipenuhi:{t:'% hampir',d:'Sejauh mana isyarat entry hampir lengkap: 100 − jarak pencetus (%). Hanya calon 90–100% dipapar. 100 dalam watchlist = paras pencetus sudah disentuh tetapi syarat hari esok (contohnya lilin hijau atau volum) belum berlaku. Corak lilin tanpa jarak = 90.',e:'99.2% = pencetus tinggal 0.8% lagi.'},
  harga_w:{t:'Harga',d:'Harga tutup terkini dalam data imbasan malam (sesi lengkap terakhir).',e:''},
  skor_panas:{t:'Skor panas (0–100)',d:'Gabungan pangkat persentil berbanding kumpulan lain: prestasi 1M 25%, 1W 15%, 3M 15%, breadth 15%, RS 15%, volum relatif 10%, aliran institusi bersih 5%. Tinggi = kuat DAN ramai fokus. Industri perlu ≥ 3 saham berharga.',e:'85 = lebih kuat daripada kira-kira 85% kumpulan lain.'},
  fasa:{t:'Fasa rotasi',d:'Kedudukan kumpulan lawan pasaran (median semua saham). Leading: 3M dan 1M atasi pasaran. Improving: 3M masih kalah tetapi 1M atasi (mula pulih). Weakening: 3M atasi tetapi 1M kalah (mula pudar). Lagging: kedua-duanya kalah. Maklumat sahaja: ujian 2019–2026 tidak menunjukkan kumpulan Leading mengatasi kumpulan lain selepas itu.',e:''},
  prestasi_1d:{t:'1H (hari ini)',d:'Purata perubahan harga hari ini bagi saham dalam kumpulan (SST Terminal, intraday jika pasaran dibuka).',e:''},
  prestasi_1w:{t:'1W',d:'Median pulangan 5 hari dagangan bagi saham dalam kumpulan.',e:''},
  prestasi_1m:{t:'1M',d:'Median pulangan 21 hari dagangan (≈ sebulan) bagi saham dalam kumpulan.',e:'+5% = saham biasa dalam kumpulan naik 5% sebulan.'},
  prestasi_3m:{t:'3M',d:'Median pulangan 63 hari dagangan (≈ 3 bulan) bagi saham dalam kumpulan.',e:''},
  rs_sek:{t:'RS (kekuatan relatif)',d:'Purata RS Rating SST Terminal (1–99) bagi saham dalam kumpulan: prestasi harga berbanding semua saham pasaran.',e:'RS 80 = saham biasa kumpulan ini mengatasi 80% pasaran.'},
  breadth:{t:'Breadth',d:'Peratus saham dalam kumpulan yang naik dalam sebulan (data seluruh pasaran AS; snapshot lama: di atas SMA50). Tinggi = kenaikan meluas, bukan bergantung pada satu dua saham.',e:'70% = 7 daripada 10 saham dalam aliran naik jangka sederhana.'},
  breadth_pasaran:{t:'Breadth pasaran',d:'Peratus semua saham AS harga ≥ USD5 yang naik dalam sebulan (screener Moomoo). Di bawah 40% = pasaran lemah; di atas 60% = sihat.',e:''},
  volum_relatif:{t:'Volum relatif',d:'Median nisbah volum purata 5 hari terakhir berbanding purata 50 hari. Melebihi 1× = lebih ramai pedagang memberi fokus.',e:'1.3× = volum 30% lebih tinggi daripada biasa.'},
  aliran_institusi:{t:'Aliran institusi',d:'Bilangan saham kumpulan dalam senarai 20 teratas pengumpulan institusi tolak bilangan dalam senarai 20 teratas pengagihan (SST institutional_flow, perubahan % pegangan institusi).',e:'+2 = dua saham lebih banyak sedang dikumpul berbanding diagihkan.'},
  volum_luar_biasa:{t:'Volum luar biasa',d:'Saham yang didagangkan ≥ 2× purata volum 20 hari hari ini (SST unusual_volume).',e:''},
  n_saham:{t:'Saham',d:'Bilangan saham dengan sejarah harga yang dipakai untuk 1W/1M/3M, breadth dan volum; \"daripada\" = semua saham yang dikelaskan dalam kumpulan.',e:''},
  pencetus:{t:'Pencetus',d:'Syarat entry terakhir yang belum dipenuhi.',e:''},
  syarat_belum:{t:'Syarat belum cukup',d:'Keadaan semasa dan apa yang perlu berlaku pada tutup esok supaya isyarat lengkap.',e:''},
  paras:{t:'Paras pencetus',d:'Paras harga tutup esok yang melengkapkan isyarat.',e:''},
  jarak:{t:'Jarak',d:'Beza peratus antara harga terkini dan paras pencetus.',e:''},
  ditambah:{t:'Tarikh masuk watchlist',d:'Tarikh tutup sesi apabila saham mula masuk watchlist.',e:''},
  hari_watch:{t:'Hari dalam watchlist',d:'Hari dagangan sejak ditambah. Calon dibuang sebaik sahaja terkeluar signal (< 90%).',e:''},
  slot_m:{t:'Slot Moomoo',d:'Bilangan posisi sistem harian bagi kaedah itu dalam akaun simulasi Moomoo (maksimum 10). Posisi yang kena isyarat keluar tidak dijual, jadi slotnya kekal dikira.',e:'10/10 = isyarat baharu kaedah ini dibeli secara maya dalam Papertrade C.'},
  slot_w:{t:'Moomoo + warisan',d:'Semua pegangan Moomoo yang dipetakan ke kaedah itu, termasuk pegangan lama v1 dan isyarat dikongsi.',e:''},
  jumlah_dag:{t:'Jumlah dagangan',d:'Bilangan posisi (dipegang + sudah keluar) dalam akaun yang dipilih. Combine = Moomoo + Claude.',e:''},
  untung_purata:{t:'Untung purata',d:'Purata untung setiap dagangan: untung akhir bagi yang sudah kena isyarat keluar, untung semasa bagi yang masih dipegang.',e:'+1.5% = secara purata setiap belian naik 1.5%.'},
  untung_median:{t:'Untung median',d:'Untung dagangan di tengah-tengah selepas disusun. Kurang terkesan oleh satu dua dagangan yang sangat besar atau sangat teruk berbanding purata.',e:'Purata +3% tetapi median −0.5%: untung datang daripada beberapa saham sahaja.'},
  kerugian_terbesar:{t:'Kerugian terbesar',d:'Untung paling rendah bagi satu dagangan (akhir atau semasa).',e:''},
  hari_purata:{t:'Purata hari dipegang',d:'Purata hari dagangan dari tarikh beli hingga hari ini (atau hingga tarikh keluar).',e:''},
  min_n:{t:'Minimum dagangan',d:'Sembunyikan kaedah yang dagangannya kurang daripada bilangan ini daripada carta dan jadual kaedah. Kad KPI dan bahagian Paling Teruk tetap mengira semua.',e:''},
  kadar_gagal:{t:'Kadar gagal',d:'Peratus dagangan kaedah itu yang sedang rugi atau keluar dengan rugi.',e:'4 rugi daripada 5 = 80%. Amaran jika ≥ 60% (≥ 3 dagangan).'},
  kerugian_purata:{t:'Kerugian purata',d:'Purata untung bagi dagangan yang rugi sahaja. Amaran jika −5% atau lebih teruk.',e:''},
  keluar_rugi:{t:'Isyarat keluar rugi',d:'Bilangan posisi yang kena isyarat keluar kaedah (henti rugi, isyarat jual) dengan untung akhir negatif. Amaran jika ≥ 3.',e:''},
  penurunan_maks:{t:'Penurunan maksimum',d:'Bagi setiap dagangan: harga rendah terendah sejak hari beli (hingga hari ini atau hingga keluar) ÷ harga beli − 1. Purata = risiko biasa yang ditanggung; terburuk = satu kejatuhan paling dalam. Lebih hampir 0 = lebih selamat.',e:'Beli 100, pernah jatuh ke 94 = −6%, walaupun kini untung.'},
  skor_us:{t:'Skor Untung×Selamat (0–100)',d:'Skor = 100 × U × S. U (untung) = 0.6 × untung purata dipetakan −5%→0 hingga +10%→1, + 0.4 × kadar menang. S (selamat) = 0.6 × penurunan maks purata dipetakan −10%→0 hingga 0%→1, + 0.4 × kerugian terbesar dipetakan −20%→0 hingga 0%→1. Tinggi hanya jika KEDUA-DUANYA baik. Kaedah dengan kurang daripada 5 dagangan didarab n/5 (keyakinan rendah).',e:'U 0.8 × S 0.9 = 72; jika hanya 2 dagangan: 72 × 0.4 = 29.'},
  keputusan_pr:{t:'Keputusan (TERUSKAN / PERHATI / HENTIKAN)',d:'BELUM CUKUP DATA: kurang daripada 20 dagangan tertutup (sudah keluar). Selepas ≥ 20: HENTIKAN jika untung purata ≤ −3% ATAU kadar gagal ≥ 75% ATAU skor < 25; TERUSKAN jika skor ≥ 55 dan untung purata positif; selainnya PERHATI. Keputusan papertrade sahaja, bukan isyarat wang sebenar.',e:'▲ TERUSKAN · ● PERHATI · ✕ HENTIKAN · ○ BELUM CUKUP DATA (bentuk berbeza dalam carta).'},
  g_s:{t:'S · Sektor',d:'Sejak 19 Okt 2026 (v2): kedudukan sektor saham itu dalam seluruh pasaran AS pada hari isyarat, ikut peratus saham sektor itu di atas SMA200, dipangkat antara 11 sektor (skor 0–100; A > 80, B > 60, C > 40, D > 20, E ≤ 20). Paparan sahaja: kajian 18 Okt 2026 mendapati gred sektor tidak membantu memilih saham, jadi tidak dikira dalam gred keseluruhan. Gred sebelum 19 Okt = v1 (skor panas). Baris "1B kini" ialah prestasi median sektor sebulan menurut tab Sector hari ini.',e:'A 91/100 · Technology = peratus saham di atas SMA200 antara tertinggi semasa isyarat.'},
  g_i:{t:'I · Industri',d:'Sejak 19 Okt 2026 (v2): kekuatan industri saham itu (plate Moomoo, seluruh pasaran AS) pada hari isyarat = pangkat Weinstein (RS lawan SPY di atas purata 52 minggu, RS naik sebulan, indeks di atas purata 30 minggu yang naik) + pangkat pulangan median 1 bulan, antara ~141 industri. A > 80, B > 60, C > 40, D > 20, E ≤ 20. Kajian 2019–2026: A kuat, B–D hampir neutral, E lemah (purata dagangan kaedah momentum A +0.03% … E −1.21% relatif). Tidak terpakai bagi kaedah pantulan.',e:'B 73/100 · Semiconductors = industri kuat, tetapi bukan 20% teratas.'},
  g_r:{t:'R · RS rating',d:'Kekuatan relatif harga saham (gaya IBD, 1–99) berbanding SELURUH pasaran AS harga ≥ USD5 (~3,900 saham; sandaran: stor harga): 40% pulangan 3 bulan terkini + 20% setiap satu daripada tiga suku sebelumnya. Gred (sejak 18 Okt 2026): A = RS 90–99 disahkan, B = 80–89 disahkan, C = 70–79 atau ≥ 80 tidak disahkan, D < 70. Disahkan = saham naik dalam 12 bulan, SPY di atas SMA200 dan Mansfield > 0 (RS line di atas purata 52 minggu). Kajian 3,830 saham 2005–2026: lebihan 63 hari atas pasaran A +1.5%, B +0.6%, C ≈ 0, D −0.2 hingga −0.4%; apabila SPY < SMA200 saham RS tinggi kalah kepada pasaran; RS 95+ purata tertinggi tetapi median ≈ 0 (ditanda berisiko). Kelebihan tidak signifikan 2005–2015. Direkod sahaja, bukan penapis belian.',e:'A · RS 92 · disahkan = 8% teratas pasaran dan pasaran sedang naik. C · RS 91 · tidak disahkan: pasaran lemah = kekuatan RS belum boleh dipercayai.'},
  g_p:{t:'P · Pemangkin (v3, sejak 18 Okt 2026)',d:'Hanya isyarat yang lulus ujian data 2012–2026. K1 premium pengumuman: earnings dijadualkan 6–21 hari dagangan lagi +2, 1–5 hari +1. K2: reaksi hari earnings ≥ +20% lawan pasaran, ≤ 10 hari lalu +4, 11–20 hari +3 (🔥 Panas). Veto berita ≤ 20 hari dagangan: tawaran saham (pencairan) atau keputusan FDA akan datang → had C; sasaran ambil alih → had D. Gred: A ≥ 3, B 2, C 1, D 0 (tiada pemangkin). Berita, analisis dan volum tidak diberi mata. Baris sebelum 18 Okt guna skala lama. Ketik tajuk untuk membuka artikel.',e:'"🔥 Panas · reaksi earnings +24.0% lawan pasaran (3 hari lalu) +4" = A; "earnings 12 hari dagangan lagi (premium pengumuman) +2" = B.'},
  g_k:{t:'Kewangan · gred kewangan v7 (sejak 18 Okt 2026)',d:'Keadaan kewangan syarikat daripada penyata suku Moomoo (dikira sendiri, bukan nisbah siap). K kekukuhan: hutang bersih/EBITDA dan FFO/hutang ikut jadual S&P, semakan Simply Wall St, distance-to-default; U keuntungan: ROIC > 9%, ROE ≥ 15% dengan ROA ≥ 6%, kemampanan 5/10 tahun, margin, aliran tunai; T pertumbuhan: EPS dan jualan YoY, ROIC tambahan; S arah suku terkini berbanding suku sama tahun lalu. Gred = purata K U T S, tidak melebihi K + 1 huruf; berubah 1 huruf hanya selepas 2 suku berturut. Peringkat (muda, tumbuh laju, matang, kitaran, merosot), bendera forensik (menurunkan keyakinan sahaja) dan jarak had Syariah (hutang dan tunai berbanding aset dan nilai pasaran 24 bulan; gagal semua kaedah = E). Rekod sahaja: tidak masuk Gred keseluruhan dan belum diuji prestasi. Spec: spec/GRED_KEWANGAN_v7.md.',e:'B (K:A U:B T:C S:B) · tumbuh laju · keyakinan sederhana · Syariah lulus.'},
  g_q:{t:'Q · Laporan suku (QR)',d:'Bilangan hari dagangan sebelum laporan suku (earnings) seterusnya. Harga boleh melompat melepasi paras henti pada hari laporan. Kajian 18 Okt 2026 (659k dagangan 134 kaedah, 2019–2026), risiko lompat henti berbanding beli > 30 hari sebelum QR: E (≤ 5 hari) 5.7×, D (6–10) 3.8×, C (11–15) 2.5×, B (16–21) 1.7×, A (> 21 atau tiada laporan dalam 30 hari) ~1×. Selepas QR: 0–1 hari sekurang-kurangnya C, 2–3 hari sekurang-kurangnya B (volatiliti belum reda). Label ini maklumat risiko sahaja, bukan penapis belian dan bukan jangkaan untung.',e:'E · 4 hari lagi · 20 Okt · Elak = laporan jatuh dalam tempoh pegangan.'},
  gred:{t:'Gred keseluruhan',d:'Purata mata dimensi pada hari isyarat (A=4, B=3, C=2, D=1, E=0). Sejak 19 Okt 2026: Industri (kecuali kaedah pantulan), Pemangkin dan QR. Sektor tidak dikira (paparan sahaja, kajian 18 Okt 2026); RS tidak dikira sejak 18 Okt 2026 (gred RS sudah menggabung pengesahan pasaran dan dinilai berasingan). Dimensi tanpa data tidak dikira. Direkod untuk diuji, belum terbukti meramal dan bukan penapis belian. Panel Prestasi ikut gred menilai setiap gred selepas ≥ 20 dagangan tertutup.',e:'Industri A, Pemangkin C, QR A = purata 3.3 → gred B.'},
  usd_sama:{t:'Nilai sama USD1,000',d:'Untung bersih jika setiap posisi bernilai USD1,000 (sama berat), tanpa mengira harga saham. Rekod tetap 1 unit; ini cara kiraan sahaja supaya saham mahal tidak mendominasi.',e:'3 posisi +10%, −5%, +2% = +USD70 atas modal USD3,000.'},
  data_kini:{t:'Kemas kini terakhir',d:'Masa data dashboard terakhir dikemas kini (harian/status) dan tarikh tutup sesi AS yang dipakai. Data dikira oleh GitHub Actions selepas pasaran AS tutup dan ditolak ke dashboard setiap hari (Isnin–Sabtu, selepas belian 9:35 NY). Merah jika lebih 30 jam tanpa kemas kini (74 jam merentas hujung minggu).',e:'"2026-10-19 22:25 MYT · data tutup 2026-10-16" = data hingga tutup Jumaat 16 Okt, ditolak Isnin malam.'},
  kat_asal:{t:'Asal kaedah',d:'Pencipta (orang atau pihak yang memperkenalkan teknik) dan sumbernya: buku, artikel, laman atau saluran YouTube. "Tidak dinyatakan" = sumber tidak menamakan pencipta; tidak diteka.',e:'Mark Minervini · Trade Like a Stock Market Wizard (2013).'},
  kat_masuk:{t:'Masuk (entry)',d:'Syarat isyarat beli varian yang sedang digunakan dalam kod. Isyarat dikira pada harga tutup; belian pada harga buka hari dagangan berikutnya.',e:''},
  kat_keluar:{t:'Keluar (exit)',d:'Sasaran untung atau isyarat jual kaedah (selain henti rugi). Isyarat jual pada tutup dilaksanakan pada harga buka esok; sasaran dijual pada paras sasaran.',e:''},
  kat_pegang:{t:'Pegang (hold)',d:'Berapa lama posisi dipegang: had masa maksimum dalam hari dagangan (jual pada tutup hari terakhir), atau tiada had iaitu pegang sehingga isyarat keluar atau henti rugi.',e:'Maks 21 hari = jual pada tutup hari ke-21 jika belum keluar.'},
  kat_henti:{t:'Henti rugi',d:'Paras jual untuk menghadkan rugi. Jika harga rendah menyentuh henti, jual pada paras henti; jika harga buka sudah di bawah henti, jual pada harga buka.',e:'Henti 12% bawah tutup isyarat: beli 100 → jual jika jatuh ke 88.'},
  kat_bt:{t:'Backtest (set 431)',d:'Keputusan enjin v1.2 bagi varian yang sama seperti dalam kod, atas 431 saham Shariah dari 1 Nov 2019 hingga 2 Okt 2026: keputusan, CAGR portfolio, MDD, skor, untung purata setiap dagangan, kadar menang, bilangan entry dan purata hari pegang. Susun ikut CAGR.',e:'UJI KERTAS · CAGR 33.3% · untung/dag +2.1% · menang 41%.'},
  kat_pt:{t:'Papertrade (M+C)',d:'Prestasi sebenar setakat ini dalam Paper Trade M (Moomoo simulasi) dan Papertrade C (maya), sama seperti tab Prestasi · Combine: untung purata (akhir bagi yang keluar, semasa bagi yang dipegang), kadar menang, kerugian terbesar dan bilangan dagangan. Label TERUSKAN/PERHATI/HENTIKAN hanya selepas ≥ 20 dagangan tertutup. Susun ikut untung purata.',e:'BELUM CUKUP DATA · +1.8% · menang 60% · 5 dagangan (2 keluar) · C 5.'},
  kat_umum:{t:'Peraturan belian',d:'Semua kaedah: isyarat pada harga tutup hari ini, beli 1 unit maya pada harga buka esok dalam Papertrade C. Dibatalkan jika harga buka ≤ henti. Tiada order Moomoo dan tiada wang sebenar.',e:''},
  slot_c:{t:'Slot Claude',d:'Posisi maya Claude bagi kaedah itu: dipegang (belum keluar) dan jumlah semua (termasuk yang sudah keluar). Tiada had.',e:''}
};
const TIPLBL={'kaedah / varian':'kaedah','keputusan':'keputusan','skor':'skor','jumlah untung':'jumlah','cagr':'cagr','kadar menang':'win','jumlah entry':'n','untung/dagangan':'avg','purata menang':'avgwin','purata untung':'avgwin','purata kalah':'avgloss','purata rugi':'avgloss','menang:kalah':'nisbah','hari pegang':'days','purata hari pegang':'days','untung/hari':'harian','mdd':'mdd','mar':'mar','tutup ≥ +10%':'ret10','sentuh +10%':'hit10','bulan ≥ +10%':'bulan10','bulan untung':'bulan_untung','faktor untung':'pf','dagangan setahun':'dagangan_setahun','separuh 1 (2019–22)':'h1','separuh 2 (2023–)':'h2','tahun atasi spy':'thn_kalah_spy','dagangan terburuk':'terburuk','atasi beli semua':'menang_ew','profil pegangan':'pegang','set saham':'set'};
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);
function applyTips(root){if(!root)return;
  root.querySelectorAll('[data-tip]').forEach(el=>el.classList.add('has-tip'));
  root.querySelectorAll('.m .k, h2').forEach(el=>{if(el.dataset.tip)return;const k=TIPLBL[(el.textContent||'').trim().toLowerCase()];if(k&&TIPS[k]){el.dataset.tip=k;el.classList.add('has-tip');}});}
function showTip(el){const T=TIPS[el.dataset.tip];if(!T)return;
  tipEl.innerHTML=`<div class="tip-h">${esc(T.t)}</div><div class="tip-b">${esc(T.d)}</div>${T.e?`<div class="tip-e"><b>Contoh:</b> ${esc(T.e)}</div>`:'<div style="height:6px"></div>'}`;
  tipEl.hidden=false;const r=el.getBoundingClientRect(),W=tipEl.offsetWidth,H=tipEl.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-W/2),vw-W-8),y=r.bottom+8;if(y+H>vh-8)y=Math.max(8,r.top-H-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';}
function hideTip(){tipEl.hidden=true;}
let tipTimer=null,tipSuppress=false;
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest&&e.target.closest('[data-tip]');hideTip();if(!el)return;tipTimer=setTimeout(()=>{tipSuppress=true;showTip(el);},450);},true);
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='pointermove'&&e.pointerType==='touch'&&tipTimer&&(Math.abs(e.movementX)+Math.abs(e.movementY))<3)return;clearTimeout(tipTimer);tipTimer=null;},true));
document.addEventListener('click',e=>{if(tipSuppress){tipSuppress=false;e.preventDefault();e.stopPropagation();}},true);
window.addEventListener('scroll',hideTip,{passive:true});
$('#setLbl').dataset.tip='set';$('#setLbl').classList.add('has-tip');

/* ================= lipat / buka panel ================= */
let foldState={};try{foldState=JSON.parse(localStorage.getItem('pbs2_fold')||'{}');}catch(e){}
const foldKey=p=>{const h=p.querySelector(':scope>.panel-h h2');return (viewId()+'|'+(h?h.textContent:'')).toLowerCase();};
function saveFold(){try{localStorage.setItem('pbs2_fold',JSON.stringify(foldState));}catch(e){}}
function applyFold(root){root.querySelectorAll('.panel').forEach(p=>{const h=p.querySelector(':scope>.panel-h');if(!h||p.closest('.sheet'))return;
  h.classList.add('foldable');h.setAttribute('role','button');h.setAttribute('tabindex','0');const shut=!!foldState[foldKey(p)];p.classList.toggle('lipat',shut);h.setAttribute('aria-expanded',String(!shut));});}
function toggleFold(p){const k=foldKey(p);const shut=!p.classList.contains('lipat');foldState[k]=shut;saveFold();p.classList.toggle('lipat',shut);p.querySelector(':scope>.panel-h').setAttribute('aria-expanded',String(!shut));if(!shut)requestAnimationFrame(()=>topScrolls(p));}
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('.panel-h.foldable');if(!h)return;if(e.target.closest('button,a,input,select'))return;toggleFold(h.parentElement);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('foldable')){e.preventDefault();toggleFold(e.target.parentElement);}});
function foldAllNow(shut){const v=document.getElementById(viewId());v.querySelectorAll('.panel').forEach(p=>{if(!p.querySelector(':scope>.panel-h'))return;foldState[foldKey(p)]=shut;p.classList.toggle('lipat',shut);});saveFold();if(!shut)requestAnimationFrame(()=>topScrolls(v));}
$('#foldAll').onclick=()=>foldAllNow(true);$('#openAll').onclick=()=>foldAllNow(false);

renderNav();renderAll();

/* ================= data langsung ================= */
(async function connect(){
  const db=window.claude?.use?await window.claude.use('db'):null;
  if(!db){setLive(false,'Data langsung tidak tersedia di paparan ini');S.live=true;renderAll();return;}
  /* tab Kaedah membaca registry dan papertrade juga */
  const re=(...tabs)=>{if(!tabs.length||tabs.includes(S.tab)||S.tab==='kaedah'&&tabs.some(t=>['backtest','ptc','ptm','prestasi'].includes(t)))renderSoon();};
  db.collection('registry').limit(1000).onSnapshot(snap=>{
    const d={};snap.docs.forEach(x=>{if(!x.exists)return;const v=x.data();d[x.id]=Object.assign({},v,{rows:(v.rows||[]).map(r=>Object.assign({},r,{jumlah:jumlahDari(r.cagr),nisbah:(r.avgwin!=null&&r.avgloss<0)?r.avgwin/-r.avgloss:null,harian:(r.avg!=null&&r.days>0)?r.avg/r.days:null}))});});S.docs=d;
    const ts=Object.values(d).map(x=>x.tarikh||'').sort().pop()||'';S.live=true;
    setLive(true,`Langsung · ${snap.size} kaedah · ujian terkini ${ts}`);re('backtest');
  },()=>setLive(false,'Sambungan terputus. Muat semula halaman.'));
  db.doc('meta/info').onSnapshot(s=>{S.meta=s.exists?s.data():null;re('backtest');},()=>{});
  const sub=(path,keyName,tabs)=>db.doc(path).onSnapshot(s=>{S[keyName]=s.exists?s.data():null;S.live=true;re(...tabs);},()=>{});
  sub('papertrade/moomoo','ptm',['ptm','prestasi']);
  sub('papertrade/moomoo_peta','ptmPeta',['ptm','prestasi']);
  sub('papertrade/claude','ptc',['ptc','prestasi']);
  /* papertrade/claude_2, _3, … tanpa had: dokumen yang wujud membuka langganan dua nombor seterusnya */
  const ptcDah=new Set();
  const subPtc=n=>{if(ptcDah.has(n))return;ptcDah.add(n);db.doc('papertrade/claude_'+n).onSnapshot(s=>{S.ptcN[n]=s.exists?s.data():null;S.live=true;if(s.exists){subPtc(n+1);subPtc(n+2);}re('ptc','prestasi');},()=>{});};
  subPtc(2);subPtc(3);
  /* dokumen besar dibahagi (standard/bahagi_db.py): asas {bahagian:{id,n}} + <nama>_2… {induk,bahagian,rows}; bahagian lama (induk lain) diabaikan */
  const subBhg=(path,keyName,tabs)=>{let asas=null;const ch={},dah=new Set();
    const gabung=()=>{let d=null;if(asas){const b=asas.bahagian;let rows=asas.rows||[];
        if(b&&b.n>1)for(let i=2;i<=b.n;i++){const c=ch[i];if(c&&c.induk===b.id)rows=rows.concat(c.rows||[]);}
        d=Object.assign({},asas,{rows});}
      S[keyName]=d;S.live=true;re(...tabs);};
    db.doc(path).onSnapshot(s=>{asas=s.exists?s.data():null;const n=asas&&asas.bahagian?asas.bahagian.n:1;
      for(let i=2;i<=n;i++){if(dah.has(i))continue;dah.add(i);db.doc(path+'_'+i).onSnapshot(t=>{ch[i]=t.exists?t.data():null;gabung();},()=>{});}
      gabung();},()=>{});};
  subBhg('papertrade/watchlist','watch',['watch','sektor']);
  subBhg('papertrade/senarai_beli','beli',['ptc']);
  sub('sektor/snapshot','sektor',['sektor']);
  db.doc('harian/status').onSnapshot(s=>{S.hst=s.exists?s.data():null;renderData();},()=>{});
  sub('prestasi/mae','mae',['prestasi']);
  sub('kaedah/katalog','kat',['kaedah']);
  /* AUTOTUNE: semua dokumen koleksi autotune (status, ringkasan, gabungan, kaedah_<ID>) */
  db.collection('autotune').limit(1000).onSnapshot(snap=>{const d={};snap.docs.forEach(x=>{if(x.exists)d[x.id]=x.data();});S.at=d;S.live=true;re('autotune','backtest');},()=>{});
})();
})();
</script>
